/* --------------------------------------------------- test case health */
/* A score you can defend in a review meeting: every point comes from a field
   the case either carries or does not, and a check your project never uses is
   not counted against anyone. This is what decides which of several thousand
   inherited cases are worth carrying into the new tree. */

const HEALTH_CHECKS = [
  { key: "steps",    w: 22, label: "Test steps" },
  { key: "expected", w: 22, label: "Expected results" },
  { key: "req",      w: 14, label: "Requirement link" },
  { key: "dup",      w: 14, label: "Duplicate risk" },
  { key: "title",    w: 12, label: "Title" },
  { key: "pre",      w: 10, label: "Precondition" },
  { key: "module",   w:  8, label: "Placement" },
  { key: "size",     w:  8, label: "Step size" }
];
const HEALTH_BANDS = [
  { key: "excellent", label: "Excellent",    min: 85, cls: "good" },
  { key: "good",      label: "Good",         min: 70, cls: "" },
  { key: "review",    label: "Needs review", min: 50, cls: "warn" },
  { key: "critical",  label: "Critical",     min:  0, cls: "crit" }
];
const healthBand = n => HEALTH_BANDS.filter(b => n >= b.min)[0];
const healthBandByKey = k => HEALTH_BANDS.filter(b => b.key === k)[0] || HEALTH_BANDS[0];

/* Which fields this project actually keeps. A team that never writes
   preconditions is not a team with ten thousand bad test cases. */
let HEALTH_PROFILE = null, HEALTH_GEN = 0;
let HEALTH_CACHE = new WeakMap();
function resetHealth() { HEALTH_PROFILE = null; HEALTH_GEN++; HEALTH_CACHE = new WeakMap(); }

function healthProfile() {
  if (HEALTH_PROFILE && HEALTH_PROFILE.n === S.archive.length) return HEALTH_PROFILE;
  const n = S.archive.length;
  const share = fn => n ? S.archive.filter(fn).length / n : 1;
  HEALTH_PROFILE = {
    n: n, gen: HEALTH_GEN,
    // under five cases there is no convention to read, so ask for everything
    pre:    n < 5 || share(c => !!clean(c.precondition)) >= 0.2,
    req:    n < 5 || share(c => !!clean(c.requirement))  >= 0.2,
    module: n < 5 || share(c => !!clean(c.path || c.module)) >= 0.2,
    names:  nameCollisions()
  };
  return HEALTH_PROFILE;
}

/* Consolidating old projects means the same test written four times under four
   project names. An exact name collision is the cheap half of that and costs
   one pass; the expensive half is what the duplicate flag on a draft does. */
function nameCollisions() {
  const seen = {}, dup = {};
  S.archive.forEach(c => {
    const k = norm(c.name);
    if (!k) return;
    if (seen[k]) dup[k] = true; else seen[k] = 1;
  });
  return dup;
}

function healthOf(item, isDraft) {
  const prof = healthProfile();
  if (!isDraft) {
    const hit = HEALTH_CACHE.get(item);
    if (hit && hit.gen === prof.gen) return hit.v;
  }
  const v = computeHealth(item, isDraft, prof);
  if (!isDraft) HEALTH_CACHE.set(item, { gen: prof.gen, v: v });
  return v;
}

function computeHealth(item, isDraft, prof) {
  const steps = item.steps || [];
  const withExp = steps.filter(x => clean(x.expected)).length;
  const r = {};

  r.steps = !steps.length
    ? { s: 0, note: "No test steps — there is nothing to run." }
    : steps.length === 1
      ? { s: 0.6, note: "A single step; most cases need an action and a check." }
      : { s: 1, note: steps.length + " steps." };

  r.expected = !steps.length
    ? { s: 0, note: "No steps, so no expected results." }
    : !withExp
      ? { s: 0, note: "Not one step states an expected result — this is a procedure, not a test." }
      : withExp === steps.length
        ? { s: 1, note: "Every step states an expected result." }
        : { s: withExp / steps.length, note: withExp + " of " + steps.length + " steps state an expected result." };

  r.req = !prof.req ? null
    : clean(item.requirement)
      ? { s: 1, note: "Traceable to " + clean(item.requirement) + "." }
      : { s: 0, note: "No requirement or issue key — the case cannot be traced." };

  if (isDraft) {
    r.dup = item.similar
      ? { s: item.similar.score >= 85 ? 0 : 0.4,
          note: "Close to the archived " + item.similar.tcid + " (" + item.similar.score + "%)." }
      : { s: 1, note: "Nothing in the knowledge base comes close to it." };
  } else {
    r.dup = prof.names[norm(item.name)]
      ? { s: 0.25, note: "Another archived case carries exactly this name — one of them is redundant." }
      : { s: 1, note: "Its name is unique in the knowledge base." };
  }

  const nm = clean(item.name);
  r.title = (!nm || /^untitled/i.test(nm))
    ? { s: 0, note: "No usable title." }
    : nm.length < 12
      ? { s: 0.4, note: "The title is " + nm.length + " characters — it will not mean much in a run list." }
      : nm.length > 140
        ? { s: 0.5, note: "The title runs to " + nm.length + " characters; it reads as a description." }
        : { s: 1, note: "The title reads clearly on its own." };

  r.pre = !prof.pre ? null
    : clean(item.precondition)
      ? { s: 1, note: "The starting state is stated." }
      : { s: 0, note: "No precondition — the starting state is left to whoever runs it." };

  r.module = !prof.module ? null
    : clean(item.path || item.module)
      ? { s: 1, note: "Placed in " + clean(item.path || item.module) + "." }
      : { s: 0, note: "No module or path — it has nowhere to live in the tree." };

  const longest = steps.reduce((n, x) => Math.max(n, clean(x.action).length), 0);
  r.size = steps.length > 25
    ? { s: 0.3, note: steps.length + " steps — long cases are hard to maintain and harder to automate." }
    : longest > 400
      ? { s: 0.5, note: "One step runs to " + longest + " characters; it holds more than one action." }
      : { s: 1, note: "The steps are a workable size." };

  let got = 0, max = 0;
  const checks = [];
  HEALTH_CHECKS.forEach(c => {
    const x = r[c.key];
    if (!x) { checks.push({ key: c.key, label: c.label, state: "na", note: "Your project does not keep this field." }); return; }
    got += x.s * c.w; max += c.w;
    checks.push({ key: c.key, label: c.label, note: x.note,
                  state: x.s >= 0.999 ? "good" : x.s >= 0.5 ? "warn" : "crit" });
  });
  const score = max ? Math.round(got / max * 100) : 100;
  return { score: score, band: healthBand(score), checks: checks };
}

function healthTooltip(h) {
  const bad = h.checks.filter(c => c.state === "warn" || c.state === "crit");
  return bad.length
    ? "Health " + h.score + "/100\n" + bad.map(c => "• " + c.note).join("\n")
    : "Health " + h.score + "/100 — nothing missing.";
}
function healthChip(h) {
  return el("span", { class: "hchip " + h.band.cls, title: healthTooltip(h) }, [
    el("span", { class: "hs", text: String(h.score) }),
    el("span", { text: h.band.label })
  ]);
}
function healthList(checks) {
  const mark = st => st === "good" ? "✓" : st === "na" ? "–" : st === "warn" ? "!" : "×";
  return el("ul", { class: "checklist" }, checks.map(k => el("li", { class: k.state }, [
    el("span", { class: "mk", text: mark(k.state) }),
    el("span", { class: "lb", text: k.label }),
    el("span", { class: "nt", text: k.note })
  ])));
}

/* ------------------------------------------------------------ generation */
const TRIGGER_SPLIT = /\s+(?:then|so that|results in|führt zu|fuehrt zu|,\s*dann|dann|→|->|=>)\s+/i;
const WHEN_LEAD = /^(when|if|once|as soon as|wenn|falls|sobald|nachdem)\b[\s:]+/i;
// Only strips a lead-in when the modal verb is actually there, so a plain sentence survives intact.
const REQ_LEAD = /^(?:(?:the system|das system|the user|der benutzer|the application|die anwendung)\s*,?\s*(?:shall|should|must|can|will|muss|soll|sollte|kann|wird|darf)\s+|as an?\s[^,]{1,40},\s*i\s+(?:want|would like)\s+to\s+|als\s[^,]{1,40},\s*(?:möchte|moechte)\s+ich\s+)/i;

function acToStep(ac, lang) {
  if (ac.gherkin && ac.gherkin.length) {
    const g = { given: [], when: [], then: [] };
    let mode = "given";
    ac.gherkin.forEach(l => {
      const m = l.match(/^(given|angenommen|gegeben\s+sei|when|wenn|then|dann|and|und|but|aber)\b[\s:]*/i);
      const head = m ? m[1].toLowerCase() : "";
      const rest = clean(l.replace(/^(given|angenommen|gegeben\s+sei|when|wenn|then|dann|and|und|but|aber)\b[\s:]*/i, ""));
      if (/^(given|angenommen|gegeben)/.test(head)) mode = "given";
      else if (/^(when|wenn)/.test(head)) mode = "when";
      else if (/^(then|dann)/.test(head)) mode = "then";
      if (rest) g[mode].push(rest);
    });
    return {
      precondition: g.given.join("; "),
      action: titlecase(g.when.join("; ")) || titlecase(ac.text),
      expected: titlecase(g.then.join("; ")) || "",
      complete: g.when.length > 0 && g.then.length > 0
    };
  }

  const text = ac.text;
  const parts = text.split(TRIGGER_SPLIT);
  if (parts.length >= 2) {
    return {
      precondition: "",
      action: titlecase(clean(parts[0]).replace(WHEN_LEAD, "").replace(REQ_LEAD, "")),
      expected: titlecase(clean(parts.slice(1).join(" "))),
      complete: true
    };
  }
  const wm = text.match(/^(?:when|if|once|wenn|falls|sobald)\b[\s:]+(.+?)[,;]\s*(.+)$/i);
  if (wm) return { precondition: "", action: titlecase(clean(wm[1])), expected: titlecase(clean(wm[2])), complete: true };

  const stripped = clean(text.replace(REQ_LEAD, "")) || text;
  return {
    precondition: "",
    action: p(lang).checkThat(stripped),
    expected: "",
    complete: false
  };
}

function applyNamePattern(pattern, ctx) {
  const out = String(pattern || "{TITLE}")
    .replace(/\{AREA\}/g, ctx.area || "")
    .replace(/\{PREFIX\}/g, ctx.prefix || "")
    .replace(/\{MODULE\}/g, ctx.module || "")
    .replace(/\{REQ\}/g, ctx.req || "")
    .replace(/\{TYPE\}/g, ctx.type || "")
    .replace(/\{TITLE\}/g, ctx.title || "");
  return clean(out.replace(/__+/g, "_").replace(/^[_\-\s]+|[_\-\s]+$/g, "").replace(/\[\s*\]/g, ""));
}

let draftSeq = 0;
function newDraft(fields) {
  draftSeq++;
  return Object.assign({
    uid: "D" + Date.now().toString(36) + "-" + draftSeq,
    review: "draft",          // where the draft stands with you
    status: "New",            // the qTest Status field
    lang: "en",               // language the scaffolding was written in
    extra: {},                // your project's own qTest fields
    needsWording: false,
    steps: []
  }, fields, { extra: Object.assign({}, fields && fields.extra) });
}

function generateFor(req) {
  const conv = S.conventions || {};
  const lang = genLangFor(req);
  const L = p(lang);
  const matches = matchesFor(req, 5);
  const chosen = req.selectedTemplate
    ? (matches.find(m => m.tc.tcid === req.selectedTemplate) || matches[0])
    : matches[0];
  const template = chosen && chosen.score >= S.gen.minScore ? chosen.tc : null;
  const templateScore = chosen ? chosen.score : 0;

  const module = (template && template.module) || clean(req.components.split(",")[0]) || (conv.modules && conv.modules[0]) || "";
  const extra = {};
  (conv.extra || []).forEach(f => { if (f.fill >= 0.4 && f.top) extra[f.name] = f.top; });

  const area = (template && template.area) || req.area || "";
  const base = {
    module,
    area,
    path: (template && template.path) || "",
    lang,
    extra: extra,
    priority: mapPriority(req.priority, conv, lang),
    status: conv.defaultStatus || L.statusNew,
    requirement: req.key,
    tags: template ? template.tags : "",
    templateId: template ? template.tcid : "",
    templateName: template ? template.name : "",
    templateScore: Math.round(templateScore * 100)
  };

  const preamble = (S.gen.usePreamble && conv.preamble) ? conv.preamble : [];
  const epilogue = (S.gen.useEpilogue && conv.epilogue) ? conv.epilogue : [];
  const pre = () => preamble.map(s => ({ action: s.action, expected: s.expected, origin: "archive" }));
  const post = () => epilogue.map(s => ({ action: s.action, expected: s.expected, origin: "archive" }));

  const nameOf = (title, type) => applyNamePattern(S.gen.namePattern || conv.namePattern, {
    prefix: conv.prefix, module: module, area: area, req: req.key, type: type, title: title
  });

  const out = [];
  const precondFromTemplate = template ? template.precondition : "";

  req.ac.forEach((ac, i) => {
    const step = acToStep(ac, lang);
    const acLabel = "AC" + (i + 1);
    // a Gherkin block reads best when the When clause names the case
    const titleSrc = ac.gherkin && step.action ? step.action : ac.text;

    if (S.gen.positive) {
      out.push(newDraft(Object.assign({}, base, {
        name: nameOf(shortTitle(titleSrc), "Positive"),
        type: pickType(conv, "positive", lang),
        technique: ac.techniques.find(k => k === "dt" || k === "st") || "ep",
        acRef: acLabel,
        description: L.descPositive(req.key, acLabel, ac.text),
        precondition: [step.precondition, precondFromTemplate].filter(Boolean).join("\n") || L.defaultPre(module, req.key),
        needsWording: !step.complete,
        steps: pre().concat([{
          action: step.action,
          expected: step.expected || L.expFallback(acLabel)
        }]).concat(post())
      })));
    }

    if (S.gen.negative && ac.techniques.indexOf("epInvalid") >= 0) {
      out.push(newDraft(Object.assign({}, base, {
        name: nameOf(shortTitle(titleSrc) + L.sufNegative, "Negative"),
        type: pickType(conv, "negative", lang),
        technique: "epInvalid",
        acRef: acLabel,
        description: L.descNegative(req.key, acLabel),
        precondition: precondFromTemplate || L.defaultPre(module, req.key),
        needsWording: true,
        steps: pre().concat([{
          action: step.action + L.actNegative,
          expected: L.expNegative
        }]).concat(post())
      })));
    }

    if (S.gen.boundary && ac.techniques.indexOf("bva") >= 0) {
      const b = extractBounds(ac.text);
      out.push(newDraft(Object.assign({}, base, {
        name: nameOf(shortTitle(titleSrc) + L.sufBoundary, "Boundary"),
        type: pickType(conv, "positive", lang),
        technique: "bva",
        acRef: acLabel,
        description: L.descBoundary(req.key, acLabel, b.join(", ")),
        precondition: precondFromTemplate || L.defaultPre(module, req.key),
        needsWording: !b.length,
        steps: pre().concat(boundarySteps(step, b, lang)).concat(post())
      })));
    }

    if (S.gen.roles && ac.techniques.indexOf("dt") >= 0) {
      out.push(newDraft(Object.assign({}, base, {
        name: nameOf(shortTitle(titleSrc) + L.sufRoles, "Roles"),
        type: pickType(conv, "positive", lang),
        technique: "dt",
        acRef: acLabel,
        description: L.descRoles(req.key, acLabel),
        precondition: L.preRoles(acLabel),
        needsWording: true,
        steps: pre().concat([
          { action: L.actRoleOk(acLabel, step.action), expected: step.expected || L.expRoleOk },
          { action: L.actRoleNo(acLabel), expected: L.expRoleNo }
        ]).concat(post())
      })));
    }
  });

  if (S.gen.e2e && req.ac.length >= 2) {
    const e2eTemplate = S.archive
      .map(tc => ({ tc, s: scoreMatch(req, tc) + (/e2e|end.?to.?end|integration|prozess|process|ablauf/i.test(tc.type + " " + tc.name) ? 0.25 : 0) }))
      .sort((a, b) => b.s - a.s)[0];
    const tpl = e2eTemplate ? e2eTemplate.tc : null;
    out.push(newDraft(Object.assign({}, base, {
      name: nameOf(shortTitle(req.summary) + L.sufE2E, "E2E"),
      type: pickType(conv, "e2e", lang),
      technique: "uc",
      acRef: "AC1–AC" + req.ac.length,
      description: L.descE2E(req.key, clean(req.summary)),
      precondition: (tpl && tpl.precondition) || L.defaultPre(module, req.key),
      templateId: tpl ? tpl.tcid : base.templateId,
      templateName: tpl ? tpl.name : base.templateName,
      needsWording: false,
      steps: pre().concat(req.ac.map((ac, i) => {
        const s = acToStep(ac, lang);
        return { action: s.action, expected: s.expected || L.expE2E("AC" + (i + 1), ac.text) };
      })).concat(post())
    })));
  }

  return out;
}

function shortTitle(text) {
  let t = clean(text).replace(REQ_LEAD, "").replace(/^(that|dass)\s+/i, "");
  t = t.split(TRIGGER_SPLIT)[0];
  if (t.length > 60) t = t.slice(0, 57).replace(/\s+\S*$/, "") + "…";
  return titlecase(t);
}
function mapPriority(jiraPrio, conv, lang) {
  const list = (conv.priorities && conv.priorities.length) ? conv.priorities : p(lang).prios;
  const prio = (jiraPrio || "").toLowerCase();
  const find = re => list.find(v => re.test(v));
  if (/blocker|highest|critical|kritisch/.test(prio)) return find(/1|crit|high|hoch/i) || list[0];
  if (/high|hoch|major/.test(prio)) return find(/high|hoch|2/i) || conv.defaultPriority || list[0];
  if (/low|niedrig|minor|trivial/.test(prio)) return find(/low|niedrig|4|3/i) || list[list.length - 1];
  return conv.defaultPriority || list[Math.floor(list.length / 2)] || list[0];
}
function pickType(conv, kind, lang) {
  const list = conv.types || [];
  const by = re => list.find(v => re.test(v));
  if (kind === "e2e") return by(/e2e|end.?to.?end|integration|system|prozess/i) || conv.defaultType || p(lang).typeE2E;
  if (kind === "negative") return by(/negativ|error|fehler/i) || conv.defaultType || p(lang).typeFunctional;
  return by(/funktion|functional|manual|manuell/i) || conv.defaultType || p(lang).typeFunctional;
}
function extractBounds(text) {
  const nums = (text.match(/\b\d+(?:[.,]\d+)?\b/g) || []).map(n => n.replace(",", "."));
  return uniq(nums).slice(0, 4);
}
function boundarySteps(step, bounds, lang) {
  const L = p(lang);
  if (!bounds.length) return [{ action: step.action + L.bvaGeneric, expected: L.expRange }];
  const lo = Number(bounds[0]), hi = Number(bounds[bounds.length - 1]);
  const s = [];
  if (!isNaN(lo)) {
    s.push({ action: step.action + L.bvaBelow(lo - 1), expected: L.expRejected });
    s.push({ action: step.action + L.bvaLow(lo), expected: L.expAccepted });
  }
  if (!isNaN(hi) && hi !== lo) {
    s.push({ action: step.action + L.bvaHigh(hi), expected: L.expAccepted });
    s.push({ action: step.action + L.bvaAbove(hi + 1), expected: L.expRejected });
  }
  return s;
}

function runGeneration(onlyKey) {
  if (!S.requirements.length) { toast("Import requirements first."); return; }
  pushUndo("forging drafts");
  buildIdf();
  deriveConventions();
  const targets = onlyKey ? S.requirements.filter(r => r.key === onlyKey) : S.requirements;
  const keys = new Set(targets.map(r => r.key));
  // Replace untouched drafts, but never what you chose by hand: an approval, or
  // a case you carried over from the knowledge base onto a criterion.
  const kept = S.drafts.filter(d => !keys.has(d.requirement) || d.review === "approved" || fromArchive(d));
  const fresh = [];
  targets.forEach(r => generateFor(r).forEach(d => fresh.push(d)));
  S.drafts = kept.concat(fresh);
  flagDuplicates();
  save();
  toast(fresh.length + " draft test case" + (fresh.length === 1 ? "" : "s") + " forged.");
}

/* ------------------------------------------------------------- exporting */
/* Columns are written with your archive's own labels where we know them, so the
   qTest mapping wizard shows exactly the names your project already uses. */

const CORE_FIELDS = ["tcid","name","description","precondition","area","module","type","priority","status","tags","stepNo","stepAction","stepExpected"];
const FALLBACK_LABEL = {
  en: { tcid:"Id", name:"Name", description:"Description", precondition:"Precondition", area:"Area", module:"Module",
        type:"Type", priority:"Priority", status:"Status", tags:"Tags",
        stepNo:"Test Step #", stepAction:"Test Step Description", stepExpected:"Test Step Expected Result" },
  de: { tcid:"Id", name:"Name", description:"Kurzbeschreibung", precondition:"Vorbedingung", area:"Bereich", module:"Modul",
        type:"Type", priority:"Priorität", status:"Status", tags:"Stichworte",
        stepNo:"Testschritt-Nr.", stepAction:"Testschritt-Beschreibung", stepExpected:"Erwartetes Ergebnis" }
};
const TRACE_LABEL = {
  en: { trace: ["Requirement","Acceptance Criterion","Test Design Technique","Derived From (archive)"],
        matrix:["Requirement","Summary","Fix Version","Acceptance Criterion","AC Text","Test Case","Technique","Review","Derived From"] },
  de: { trace: ["Anforderung","Abnahmekriterium","Testentwurfsverfahren","Abgeleitet aus (Archiv)"],
        matrix:["Anforderung","Titel","Fix Version","Abnahmekriterium","Kriteriumstext","Testfall","Verfahren","Review","Abgeleitet aus"] }
};

const archiveLabels = () => (S.archiveHeaders && S.archiveHeaders.labels) || {};
function headerLang() {
  return (S.exp.headerLang === "de" || S.exp.headerLang === "en") ? S.exp.headerLang : genLangFor(null);
}
/* A column your archive did not have still has to match the labels it did have,
   so an English export never grows a lone "Vorbedingung". */
function archiveLabelLang() {
  const lbl = archiveLabels();
  let de = 0, en = 0;
  Object.keys(lbl).forEach(f => {
    const v = norm(lbl[f]);
    if (FALLBACK_LABEL.de[f] && norm(FALLBACK_LABEL.de[f]) === v) de++;
    if (FALLBACK_LABEL.en[f] && norm(FALLBACK_LABEL.en[f]) === v) en++;
  });
  return de > en ? "de" : "en";
}
function coreFields() {
  // the keyword column is only written when your archive actually had one
  const anyArea = S.archive.some(c => c.area) || S.drafts.some(d => d.area);
  return CORE_FIELDS.filter(f =>
    (f !== "tags" || archiveLabels().tags) && (f !== "area" || anyArea));
}
function labelFor(field) {
  if (S.exp.headerLang === "archive") {
    const own = archiveLabels()[field];
    return own || FALLBACK_LABEL[archiveLabelLang()][field];
  }
  return FALLBACK_LABEL[headerLang()][field];
}
const traceLabels = which =>
  TRACE_LABEL[S.exp.headerLang === "archive" ? archiveLabelLang() : headerLang()][which];

function exportedDrafts() {
  return S.exp.onlyApproved ? S.drafts.filter(d => d.review === "approved") : S.drafts.filter(d => d.review !== "rejected");
}
function customFieldNames() {
  return S.exp.customFields ? ((S.conventions && S.conventions.extra) || []).filter(f => f.fill >= 0.2).map(f => f.name) : [];
}

/* After the tree reorganisation the module IS the path, so the Module column
   can carry it whole. The separator is configurable because whether qTest
   splits it into sub-modules depends on the import settings. */
function moduleCell(d) {
  if (S.exp.modulePath && d.path) {
    return String(d.path).split(">").map(x => clean(x)).filter(Boolean).join(S.exp.pathSep);
  }
  return d.module || "";
}

/* A typo in a 60-character path does not fail the import — it quietly creates a
   stray module in qTest. Once the tree is known, every path can be checked. */
function unknownPaths() {
  if (!S.moduleTree || !S.moduleTree.length) return [];
  const known = {};
  S.moduleTree.forEach(x => { known[clean(x)] = true; });
  return uniq(exportedDrafts().map(d => clean(d.path)).filter(x => x && !known[x]));
}

function buildQTestRows() {
  const fields = coreFields();
  const custom = customFieldNames();
  const rows = [fields.map(labelFor).concat(custom).concat(S.exp.traceability ? traceLabels("trace") : [])];

  exportedDrafts().forEach(d => {
    const steps = d.steps.length ? d.steps : [{ action: "", expected: "" }];
    steps.forEach((s, i) => {
      const first = i === 0;
      const r = fields.map(f => {
        if (f === "stepNo") return String(i + 1);
        if (f === "stepAction") return s.action;
        if (f === "stepExpected") return s.expected;
        if (f === "tcid") return "";                                   // empty => qTest creates a new case
        if (f === "name") return (first || S.exp.repeatName) ? d.name : "";
        if (f === "module") return first ? moduleCell(d) : "";
        return first ? (d[f] || "") : "";
      });
      custom.forEach(name => r.push(first ? ((d.extra && d.extra[name]) || "") : ""));
      if (S.exp.traceability) r.push(
        first ? d.requirement : "",
        first ? (d.acRef || "") : "",
        first ? techName(d.technique, d.lang || "en") : "",
        first ? (d.templateId ? d.templateId + " · " + d.templateName : "") : ""
      );
      rows.push(r);
    });
  });
  return rows;
}

function buildTraceRows() {
  const rows = [traceLabels("matrix")];
  S.requirements.forEach(r => {
    const mine = S.drafts.filter(d => d.requirement === r.key && d.review !== "rejected");
    if (!mine.length) {
      rows.push([r.key, r.summary, r.fixVersion || "", "", "", "— NO COVERAGE —", "", "gap", ""]);
      return;
    }
    mine.forEach(d => {
      const acIdx = d.acRef && /^AC(\d+)/.test(d.acRef) ? Number(RegExp.$1) - 1 : -1;
      rows.push([r.key, r.summary, r.fixVersion || "", d.acRef || "",
                 acIdx >= 0 && r.ac[acIdx] ? r.ac[acIdx].text : "",
                 d.name, techName(d.technique, d.lang || "en"), d.review, d.templateId || ""]);
    });
  });
  return rows;
}

/* --------------------------------------------- Tosca automation spec */
/* A manual step is prose; a Tosca TestStepValue is a triple of control,
   ActionMode and value. This reads the prose into those triples so the
   automation engineer starts from a filled sheet instead of a blank one.
   The column layout is provisional until it is checked against the project's
   own Tosca import — the analysis below does not depend on that. */

const TOSCA_VERBS = [
  { mode: "Buffer", re: /\b(merken|notieren|puffern|zwischenspeichern|buffer|remember|note down|wird vergeben|wird erzeugt|wird generiert)\b/i },
  { mode: "Verify", re: /\b(prüfen|pruefen|prüfung|kontrollieren|verifizieren|wird angezeigt|werden angezeigt|angezeigt|erscheint|enthält|enthaelt|verify|check|assert|is displayed|are displayed|shows|contains)\b/i },
  { mode: "Input",  re: /\b(eingeben|eingabe|erfassen|eintragen|ausfüllen|ausfuellen|setzen|pflegen|hinterlegen|enter|type|fill|input)\b/i },
  { mode: "WaitOn", re: /\b(warten|abwarten|wait for|wait until)\b/i },
  { mode: "Select", re: /\b(auswählen|auswaehlen|wählen|waehlen|klicken|anklicken|drücken|druecken|aufrufen|öffnen|oeffnen|starten|navigieren|markieren|ankreuzen|häkchen|haekchen|select|click|press|choose|open|navigate|tick)\b/i }
];
const TOSCA_MODULE_HINT  = /\b(?:transaktion|transaction|anwendung|modul|module|maske|screen|seite|page|kachel|tile|dialog|fenster|window)\s+([A-ZÄÖÜ][\wÄÖÜäöüß./-]*(?:\s+[A-ZÄÖÜ][\wÄÖÜäöüß./-]*){0,3})/i;
const TOSCA_CONTROL_HINT = /\b(?:feld|field|schaltfläche|schaltflaeche|button|checkbox|kontrollkästchen|dropdown|liste|list|spalte|column|register|tab|kachel|tile|eingabefeld)\s+([A-ZÄÖÜ][\wÄÖÜäöüß./-]*(?:[ -][A-ZÄÖÜ][\wÄÖÜäöüß./-]*){0,3})/i;
const TOSCA_QUOTED = /["“„»']([^"“”„«»']{2,60})["”“«»']/;

/* one step cell often holds a small bullet list; each line is its own value */
function toscaLines(text) {
  return String(text || "")
    .split(/\r?\n|(?:^|\s)[•‣]\s*/)
    .map(l => clean(l).replace(/^[-–*]\s*/, ""))
    .filter(l => l.length > 1);
}
function toscaMode(line, fallback) {
  for (let i = 0; i < TOSCA_VERBS.length; i++) if (TOSCA_VERBS[i].re.test(line)) return TOSCA_VERBS[i].mode;
  return fallback;
}
/* "Sortierung=Titel" is already a control/value pair */
function toscaPairs(line) {
  const out = [];
  line.split(/;\s+/).forEach(part => {
    const m = part.match(/^([^=]{1,60}?)\s*=\s*(.+)$/);
    if (m && !/^https?:/i.test(part)) out.push({ control: clean(m[1]).replace(/^[-–*]\s*/, ""), value: clean(m[2]) });
  });
  return out;
}
const TOSCA_NOISE = /^(der|die|das|den|dem|des|ein|eine|einen|einem|einer|the|a|an|es|im|in|bei|mit|für|fuer|nach|von|vom|auf|aus|alle|kein|keine|und|oder|wird|werden|prüfen|pruefen|prüfung|kontrolle|aufrufen|auswahl|auswählen|auswaehlen|klick|klicken|eingeben|eingabe|öffnen|oeffnen|starten|anzeige|check|verify|open|select|click|enter|input|display)$/i;

function toscaControl(line) {
  let m = line.match(TOSCA_CONTROL_HINT); if (m) return clean(m[1]);
  m = line.match(TOSCA_QUOTED);           if (m) return clean(m[1]);
  m = line.match(TOSCA_MODULE_HINT);      if (m) return clean(m[1]);
  // otherwise the first capitalised word that is not an article or the verb
  const words = line.match(/[A-ZÄÖÜ][\wÄÖÜäöüß-]{2,}/g) || [];
  for (let i = 0; i < words.length; i++) {
    if (TOSCA_NOISE.test(words[i])) continue;
    const next = words[i + 1];
    // "Kompletter Nachrichteninhalt" — the adjective is capitalised, the noun follows
    if (next && /(er|es)$/.test(words[i]) && words[i].length >= 6 &&
        line.indexOf(words[i] + " " + next) >= 0 && !TOSCA_NOISE.test(next)) return next;
    return words[i];
  }
  return "";
}
function toscaValue(line, mode) {
  const q = line.match(TOSCA_QUOTED);
  if (q) return clean(q[1]);
  const num = line.match(/\b(\d+(?:[.,]\d+)?)\b/);
  if (mode === "Input" && num) return num[1];
  return "";            // left for the engineer rather than inventing Tosca syntax
}

/* Every value row a single manual step implies. ctx carries the module
   forward, the way a Tosca test case stays inside a module until it moves. */
function toscaStepRows(step, ctx) {
  const rows = [];
  const mm = clean(step.action).match(TOSCA_MODULE_HINT);
  if (mm) ctx.module = clean(mm[1]);

  const emit = (line, forced, fallback) => {
    const pairs = toscaPairs(line);
    if (pairs.length) {
      pairs.forEach(pr => rows.push({ module: ctx.module, control: pr.control, mode: forced || toscaMode(line, "Input"), value: pr.value, source: line }));
      return;
    }
    const mode = forced || toscaMode(line, fallback);
    rows.push({ module: ctx.module, control: toscaControl(line), mode: mode, value: toscaValue(line, mode), source: line });
  };

  toscaLines(step.action).forEach((line, i) => emit(line, null, i === 0 ? "Select" : "Input"));
  toscaLines(step.expected).forEach(line => emit(line, "Verify"));
  return rows;
}

const TOSCA_COLUMNS = ["TestCase","Folder","TestStep #","TestStep","Module","Control","ActionMode","Value","Source sentence","Origin"];

function buildToscaRows() {
  const rows = [TOSCA_COLUMNS];
  exportedDrafts().forEach(d => {
    const ctx = { module: d.module || "" };
    d.steps.forEach((s, i) => {
      const values = toscaStepRows(s, ctx);
      const stepName = clean(s.action).slice(0, 80) || ("Step " + (i + 1));
      if (!values.length) {
        rows.push([d.name, d.module || "", String(i + 1), stepName, ctx.module, "", "Select", "", clean(s.action), d.templateId || d.requirement || ""]);
        return;
      }
      values.forEach((v, j) => rows.push([
        j === 0 ? d.name : "",
        j === 0 ? (d.module || "") : "",
        j === 0 ? String(i + 1) : "",
        j === 0 ? stepName : "",
        v.module, v.control, v.mode, v.value, v.source,
        j === 0 ? (d.templateId || d.requirement || "") : ""
      ]));
    });
  });
  return rows;
}

/* Turn a manual test case straight from the archive into a draft, so an
   existing qTest case can be carried over to Tosca without a requirement. */
function draftFromArchiveCase(c) {
  return newDraft({
    name: c.name,
    area: c.area || "",
    path: c.path || "",
    module: c.module,
    type: c.type,
    priority: c.priority,
    status: c.status,
    tags: c.tags,
    lang: detectLang(archiveText(c)),
    requirement: c.requirement || "",
    acRef: "",
    technique: "uc",
    description: c.description,
    precondition: c.precondition,
    templateId: c.tcid,
    templateName: c.name,
    templateScore: 100,
    origin: "archive",
    extra: Object.assign({}, c.extra),
    steps: c.steps.map(s => ({ action: s.action, expected: s.expected }))
  });
}

function convertArchiveCases(list) {
  if (!list.length) { toast("Nothing to convert."); return; }
  const have = {};
  S.drafts.forEach(d => { if (fromArchive(d)) have[d.templateId] = true; });
  const fresh = list.filter(c => !have[c.tcid]).map(draftFromArchiveCase);
  if (!fresh.length) { toast("Those cases are already in Review."); return; }
  S.drafts = S.drafts.concat(fresh);
  S.stage = "review";
  save(); renderAll();
  toast(fresh.length + " manual case" + (fresh.length === 1 ? "" : "s") + " carried over — review, then export as a Tosca spec.");
}

function copyText(text) {
  const done = () => toast("Copied to clipboard.");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = el("textarea", { style: "position:fixed;opacity:0;top:0;left:0" });
  ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) { toast("Copy blocked — select the text and copy manually."); }
  ta.remove();
}
function trySave(filename, text) {
  try {
    const blob = new Blob([text], { type: /\.json$/.test(filename) ? "application/json" : "text/csv;charset=utf-8" });
    const a = el("a", { href: URL.createObjectURL(blob), download: filename });
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast("Saving " + filename + " — if nothing appears, use Copy instead.");
  } catch (e) { toast("Download blocked here — use Copy instead."); }
}

const STAGES = [
  { id: "archive",      label: "Knowledge Base", count: () => S.archive.length + S.history.length },
  { id: "requirements", label: "New Requirements", count: () => S.requirements.length },
  { id: "match",        label: "Match",        count: () => S.archive.length && S.requirements.length ? S.requirements.length : 0 },
  { id: "generate",     label: "Generate",     count: () => S.drafts.length },
  { id: "review",       label: "Review",       count: () => S.drafts.filter(d => d.review === "approved").length },
  { id: "coverage",     label: "Coverage",     count: () => S.requirements.length ? coverageRows().filter(x => !x.cases.length).length : 0 },
  { id: "export",       label: "Export",       count: () => exportedDrafts().length }
];

function renderRail() {
  const rail = $("#rail");
  rail.textContent = "";
  const shell = $("#shell");
  if (shell) shell.classList.toggle("folded", !!S.railFold);
  rail.appendChild(el("div", { class: "railtop" },
    el("button", {
      class: "railfold", type: "button",
      title: S.railFold ? "Widen the pipeline" : "Fold the pipeline away",
      "aria-label": S.railFold ? "Widen the pipeline" : "Fold the pipeline away",
      onclick: () => { S.railFold = !S.railFold; save(); renderAll(); }
    }, S.railFold ? "\u00bb" : "\u00ab")));
  STAGES.forEach((s, i) => {
    const n = s.count();
    rail.appendChild(el("button", {
      class: "stage", type: "button", "aria-current": S.stage === s.id ? "true" : "false",
      title: s.label + (n ? " \u2014 " + n : ""),
      onclick: () => goto(s.id)
    }, [
      el("span", { class: "num", text: String(i + 1) }),
      el("span", { class: "lbl", text: s.label }),
      el("span", { class: "cnt", text: n ? String(n) : "" })
    ]));
  });
}

function renderKpis() {
  const box = $("#kpis");
  box.textContent = "";
  const acTotal = S.requirements.reduce((n, r) => n + r.ac.length, 0);
  const acCovered = new Set();
  S.drafts.filter(d => d.review !== "rejected").forEach(d => {
    if (d.acRef && /^AC(\d+)$/.test(d.acRef)) acCovered.add(d.requirement + "/" + d.acRef);
    if (/^AC1–AC(\d+)$/.test(d.acRef || "")) for (let i = 1; i <= Number(RegExp.$1); i++) acCovered.add(d.requirement + "/AC" + i);
  });
  const cov = acTotal ? Math.round(acCovered.size / acTotal * 100) : 0;
  const approved = S.drafts.filter(d => d.review === "approved").length;
  const needs = S.drafts.filter(d => d.needsWording && d.review === "draft").length;
  const steps = S.archive.reduce((n, c) => n + c.steps.length, 0);

  const linkedCount = S.history.filter(h => linkedCases(h).length).length;
  box.appendChild(kpiTile("Knowledge base", String(S.archive.length),
    S.history.length ? S.history.length + " past requirements, " + linkedCount + " linked" : steps + " steps indexed",
    "", undefined, () => goto("archive")));
  box.appendChild(kpiTile("This release", String(S.requirements.length), acTotal + " acceptance criteria",
    "", undefined, () => goto("requirements")));
  box.appendChild(kpiTile("AC coverage", cov + "%", acCovered.size + " of " + acTotal + " covered",
    cov >= 90 ? "is-good" : cov >= 50 ? "is-warn" : (acTotal ? "is-crit" : ""), cov, () => goto("coverage")));
  box.appendChild(kpiTile("Drafts", String(S.drafts.length), approved + " approved",
    "", undefined, () => goto("review")));
  box.appendChild(kpiTile("Needs wording", String(needs),
    needs ? "expected result is generic" : "all drafts have a result",
    needs ? "is-warn" : "is-good", undefined, needs ? () => goto("review", { draftFlag: "needsWording" }) : null));
}

/* A tile with somewhere to go is a button; one without stays a plain figure. */
function kpiTile(k, v, n, cls, meter, go) {
  const kids = [
    el("span", { class: "k", text: k }),
    el("span", { class: "v", text: v }),
    n ? el("span", { class: "n", text: n }) : null
  ];
  const t = go
    ? el("button", { class: "kpi " + (cls || ""), type: "button", title: "Open " + k.toLowerCase(), onclick: go }, kids)
    : el("div", { class: "kpi " + (cls || "") }, kids);
  if (meter !== undefined) t.appendChild(el("div", { class: "meter" }, el("i", { style: "width:" + Math.max(2, meter) + "%" })));
  return t;
}

function renderAll() {
  renderRail(); renderKpis(); renderUndo();
  const p = $("#panel");
  p.textContent = "";
  ({ archive: viewArchive, requirements: viewRequirements, match: viewMatch, generate: viewGenerate,
     review: viewReview, coverage: viewCoverage, export: viewExport }[S.stage] || viewArchive)(p);
  runPendingScroll();
}

/* --------------------------------------------------------- stage: archive */
function viewArchive(p) {
  p.appendChild(head("Knowledge base",
    "What the tool has to reason from: the test cases you have already written, and the requirements they were written for. Feed it both and a new requirement can be answered with “this is close to LAG-3011, which we covered like this” instead of a keyword guess."));

  const importCard = el("div", { class: "card" }, [
    el("h3", { text: "Import" }),
    el("p", { class: "card-sub", text: "The qTest export as .xlsx, or CSV in any delimiter. Import as often as you like — files add to the archive." })
  ]);
  // a corporate proxy may block the CDN the spreadsheet reader comes from
  if (typeof XLSX === "undefined") {
    importCard.appendChild(el("div", { class: "note warn", html: "<strong>Excel files cannot be read here.</strong><br>The spreadsheet reader did not load, most likely because this network blocks cdnjs.cloudflare.com. In qTest choose <em>Save as</em> → CSV, or open the .xlsx in Excel and save it as CSV — everything else works unchanged." }));
  }
  const file = el("input", { type: "file", id: "arc-file", accept: ".xlsx,.xls,.xlsm,.csv,.tsv,.txt", multiple: true });
  file.addEventListener("change", async e => {
    const files = Array.from(e.target.files || []);
    let added = 0, updated = 0;
    for (const f of files) {
      let tables;
      try { tables = await readTables(f); }
      catch (err) { toast("Could not read " + f.name + ": " + err.message); continue; }
      const path = clean(S.importPath) || areaFromFile(f.name);
      const area = pathLeaf(path);
      for (const t of tables) {
        const { cases, headers, labels, runExport, extraHeaders } =
          ingestArchiveRows(t.rows, moduleFromSheet(t.sheet));
        cases.forEach(c => { c.area = area; c.path = path; });
        const m = mergeArchive(cases);
        added += m.added; updated += m.updated;
        if (!S.archiveHeaders) S.archiveHeaders = { list: headers, labels: labels, qtestLike: headers.some(h => /test ?step|testschritt/i.test(h)), extra: [] };
        S.archiveHeaders.extra = uniq((S.archiveHeaders.extra || []).concat(extraHeaders)).slice(0, 30);
        if (runExport) S.archiveHeaders.runExport = true;
      }
    }
    afterArchiveChange(added, updated, files.length);
    e.target.value = "";
  });
  const known = uniq((S.moduleTree || []).concat((S.conventions && S.conventions.paths) || []));
  const dl = el("datalist", { id: "path-list" }, known.map(x => el("option", { value: x })));
  const pathIn = el("input", {
    type: "text", id: "import-path", value: S.importPath, list: "path-list",
    placeholder: "Anwendungen > Bibliothekssysteme > Katalogverwaltung"
  });
  pathIn.addEventListener("input", e => { S.importPath = e.target.value; save(); });

  const treeText = el("textarea", {
    id: "tree-paste", style: "min-height:150px",
    placeholder: "Anwendungen\n  Bibliothekssysteme\n    Katalogverwaltung\n      Katalogsuche\n\n…or one path per line: A > B > C"
  });

  importCard.appendChild(el("div", { class: "stack" }, [
    el("label", { class: "field" }, [
      el("span", { text: "Where this import belongs — a node of your qTest module tree" }),
      pathIn, dl
    ]),
    el("details", { class: "raw" }, [
      el("summary", { text: known.length ? "Module tree — " + known.length + " nodes known" : "Paste your qTest module tree once" }),
      el("p", { class: "small", text: "Copy the tree out of qTest and paste it here. Indentation builds the hierarchy; a line that already contains “>” is taken as a full path. Every node becomes a suggestion in the field above, so you never type a path twice." }),
      treeText,
      el("div", { class: "row", style: "margin-top:8px" }, [
        el("button", {
          class: "btn primary sm", type: "button", onclick: () => {
            const paths = parseModuleTree(treeText.value);
            if (!paths.length) { toast("Nothing recognised in that text."); return; }
            S.moduleTree = uniq((S.moduleTree || []).concat(paths));
            save(); renderAll();
            toast(paths.length + " nodes read — " + S.moduleTree.length + " known in total.");
          }
        }, "Read tree"),
        S.moduleTree.length ? el("button", {
          class: "btn ghost sm", type: "button",
          onclick: () => { S.moduleTree = []; save(); renderAll(); toast("Module tree cleared."); }
        }, "Forget the tree") : null
      ])
    ]),
    file,
    el("details", { class: "raw" }, [
      el("summary", { text: "…or paste the export here" }),
      el("textarea", { id: "arc-paste", placeholder: "Id;Name;Precondition;Test Step #;Test Step Description;Test Step Expected Result;Module;Type;Priority" }),
      el("div", { class: "row", style: "margin-top:8px" }, [
        el("button", {
          class: "btn primary sm", type: "button", onclick: () => {
            const t = $("#arc-paste").value;
            if (!clean(t)) { toast("Nothing pasted yet."); return; }
            const { cases, headers, labels, runExport, extraHeaders } = ingestArchiveRows(parseDelimited(t));
            const pastedPath = clean(S.importPath);
            cases.forEach(c => { c.area = pathLeaf(pastedPath); c.path = pastedPath; });
            const m = mergeArchive(cases);
            if (!S.archiveHeaders) S.archiveHeaders = { list: headers, labels: labels, qtestLike: headers.some(h => /test ?step|testschritt/i.test(h)), extra: [] };
            S.archiveHeaders.extra = uniq((S.archiveHeaders.extra || []).concat(extraHeaders)).slice(0, 30);
            if (runExport) S.archiveHeaders.runExport = true;
            afterArchiveChange(m.added, m.updated, 1);
          }
        }, "Add to archive")
      ])
    ])
  ]));

  const convCard = el("div", { class: "card" }, [el("h3", { text: "Conventions read from your archive" })]);
  if (!S.conventions) convCard.appendChild(el("p", { class: "small", text: "Import test cases and the app will read your naming pattern, standard steps and field values out of them." }));
  else {
    const c = S.conventions;
    const list = el("div", { class: "stack" });
    list.appendChild(el("div", { class: "row" }, [
      el("span", { class: "chip accent", text: "language: " + (LANG_LABEL[c.lang] || c.lang) }),
      el("span", { class: "chip mono accent", text: "naming: " + c.namePattern }),
      el("span", { class: "chip mono", text: "default type: " + (c.defaultType || "–") }),
      el("span", { class: "chip mono", text: "default priority: " + (c.defaultPriority || "–") }),
      el("span", { class: "chip mono", text: "ø " + c.avgSteps + " steps/case" })
    ]));
    if (c.preamble.length) list.appendChild(el("p", { class: "small", html: "<strong>Standard opening steps</strong> found in your archive — reused in every generated case:" }));
    c.preamble.forEach(s => list.appendChild(el("div", { class: "matchrow" }, [
      el("span", { class: "nm", text: s.action }),
      el("span", { class: "score", text: Math.round(s.share * 100) + "% of cases" })
    ])));
    if (c.epilogue.length) list.appendChild(el("p", { class: "small", html: "<strong>Standard closing step</strong>:" }));
    c.epilogue.forEach(s => list.appendChild(el("div", { class: "matchrow" }, [
      el("span", { class: "nm", text: s.action }),
      el("span", { class: "score", text: Math.round(s.share * 100) + "% of cases" })
    ])));
    convCard.appendChild(list);
  }

  const histCard = el("div", { class: "card" }, [
    el("h3", { text: "Past requirements" }),
    el("p", { class: "card-sub", text: "The tickets your archived cases were written for — same formats as the release import. Linked automatically wherever a case names its issue key." })
  ]);
  const histFile = el("input", { type: "file", id: "hist-file", accept: ".xlsx,.xls,.xlsm,.csv,.tsv,.txt,.json,.xml", multiple: true });
  histFile.addEventListener("change", async e => {
    const files = Array.from(e.target.files || []);
    let added = 0;
    for (const f of files) {
      try {
        const reqs = await parseRequirementFile(f);
        const have = {};
        S.history.forEach(h => { have[h.key] = true; });
        const fresh = reqs.filter(r => !have[r.key]);
        S.history = S.history.concat(fresh);
        added += fresh.length;
      } catch (err) { toast("Could not read " + f.name + ": " + err.message); }
    }
    buildIdf(); save(); renderAll();
    const linked = S.history.filter(h => linkedCases(h).length).length;
    toast(added + " past requirement" + (added === 1 ? "" : "s") + " added — " + linked + " of " + S.history.length + " linked to archived cases.");
    e.target.value = "";
  });
  histCard.appendChild(el("div", { class: "stack" }, [histFile]));

  if (S.history.length) {
    const linked = S.history.filter(h => linkedCases(h).length);
    histCard.appendChild(el("div", { class: "row", style: "margin-top:10px" }, [
      el("span", { class: "chip accent mono", text: S.history.length + " requirements" }),
      el("span", { class: "chip mono " + (linked.length ? "good" : "warn"), text: linked.length + " linked to cases" }),
      el("button", { class: "btn ghost sm", type: "button", onclick: () => { pushUndo("clearing past requirements"); S.history = []; buildIdf(); save(); renderAll(); } }, "Clear")
    ]));
    if (!linked.length) {
      histCard.appendChild(el("div", { class: "note warn", style: "margin-top:10px", text: "None of them could be linked. A case is linked when its requirement column names the issue key — check that your qTest export includes Anforderung or Test Case Jira Requirement ID." }));
    }
    const tw = el("div", { class: "tablewrap", style: "margin-top:10px; max-height:320px; overflow:auto" });
    const t = el("table");
    t.appendChild(el("thead", {}, el("tr", {}, ["Key", "Summary", "AC", "Cases"].map(h =>
      el("th", { text: h, class: (h === "AC" || h === "Cases") ? "num" : "" })))));
    const tb = el("tbody");
    S.history.slice(0, 300).forEach(h => {
      const n = linkedCases(h).length;
      tb.appendChild(el("tr", { id: "h-" + h.key }, [
        el("td", { class: "id", text: h.key }),
        el("td", { text: h.summary }),
        el("td", { class: "num", text: String(h.ac.length) }),
        el("td", { class: "num" }, el("span", { class: "chip " + (n ? "good" : ""), text: String(n) }))
      ]));
    });
    t.appendChild(tb); tw.appendChild(t); histCard.appendChild(tw);
  }

  p.appendChild(el("div", { class: "split" }, [importCard, histCard]));
  p.appendChild(migrationCard());
  p.appendChild(convCard);

  if (S.archiveHeaders && S.archiveHeaders.runExport) {
    p.appendChild(el("div", { class: "note warn", html:
      "<strong>That was a Test Run export.</strong><br>" +
      "It holds the execution — the Id is the run (TR-…), Status is the result, and there is no Module or Precondition column, " +
      "so generated cases fall back to a default precondition and an empty module. " +
      "The step wording and your naming convention are still read from it. " +
      "For a full archive use <em>Test Design → Export Test Cases</em> instead." }));
  }

  if (!S.archive.length) {
    p.appendChild(el("div", { class: "empty" }, [
      el("p", { text: "The knowledge base has no test cases yet." }),
      el("div", { class: "row", style: "justify-content:center;margin-top:10px" }, [
        el("button", { class: "btn sm", type: "button", onclick: loadSample }, "Load a sample knowledge base")
      ])
    ]));
    return;
  }

  const areas = uniq([].concat.apply([], S.archive.map(pathSegments)));
  if (areas.length) {
    const chips = el("div", { class: "row", style: "margin-bottom:2px" }, [
      el("span", { class: "small", text: "Tree:" })
    ].concat(areas.map(a => {
      const n = S.archive.filter(c => pathSegments(c).indexOf(a) >= 0).length;
      const on = S.filters.archiveArea === a;
      return el("button", {
        class: "chip " + (on ? "accent" : ""), type: "button",
        style: "cursor:pointer",
        onclick: () => { S.filters.archiveArea = on ? "" : a; renderAll(); }
      }, a + " · " + n);
    })));
    p.appendChild(chips);

    if (S.filters.archiveArea) {
      const sel = S.filters.archiveArea;
      const rename = el("input", { type: "text", id: "area-rename", value: sel, style: "max-width:260px" });
      p.appendChild(el("div", { class: "filterbar" }, [
        el("span", { class: "small", text: "Rename this node everywhere:" }),
        rename,
        el("button", {
          class: "btn sm", type: "button", onclick: () => {
            const to = clean(rename.value);
            if (!to || to === sel) return;
            S.archive.forEach(c => {
              const segs = pathSegments(c);
              const i = segs.indexOf(sel);
              if (i < 0) return;
              segs[i] = to;
              c.path = segs.join(" > ");
              c.area = pathLeaf(c.path);
            });
            S.filters.archiveArea = to;
            deriveConventions(); save(); renderAll();
            toast("Area renamed to " + to + ".");
          }
        }, "Rename"),
        el("button", {
          class: "btn ghost sm", type: "button", onclick: () => {
            pushUndo("removing a branch");
            S.archive = S.archive.filter(c => pathSegments(c).indexOf(sel) < 0);
            S.filters.archiveArea = "";
            buildIdf(); deriveConventions(); save(); renderAll();
            toast("Removed every case of that area.");
          }
        }, "Remove this branch from the archive")
      ]));
    }
  }

  /* Which of these are worth carrying into the new tree, before you decide
     what to migrate. The bands filter the table, so the number is a way in. */
  if (S.archive.length >= 3) {
    const dist = {};
    HEALTH_BANDS.forEach(b => { dist[b.key] = 0; });
    let sum = 0;
    S.archive.forEach(c => { const h = healthOf(c); dist[h.band.key]++; sum += h.score; });
    const hmax = Math.max.apply(null, [1].concat(HEALTH_BANDS.map(b => dist[b.key])));
    const avg = Math.round(sum / S.archive.length);
    const skipped = healthProfile();
    const notKept = [!skipped.pre ? "preconditions" : null, !skipped.req ? "requirement links" : null,
                     !skipped.module ? "modules" : null].filter(Boolean);
    p.appendChild(el("div", { class: "card" }, [
      el("div", { class: "row" }, [
        el("h3", { text: "Test health", style: "margin:0" }),
        el("span", { style: "margin-left:auto" }),
        el("span", { class: "hchip " + healthBand(avg).cls,
          title: "The mean across all " + S.archive.length + " archived cases." }, [
          el("span", { class: "hs", text: String(avg) }),
          el("span", { text: "average" })
        ])
      ]),
      el("p", { class: "card-sub", style: "margin-top:8px", text:
        "Scored on what each case actually carries: steps, expected results, a requirement, a place in the tree, a title that reads. " +
        (notKept.length
          ? "Your archive does not keep " + notKept.join(" or ") + ", so those are not counted against anyone."
          : "Click a band to show only those cases.") }),
      el("div", { class: "bars" }, HEALTH_BANDS.map(b => {
        const n = dist[b.key], on = S.filters.archiveHealth === b.key;
        const kids = [
          el("span", {}, el("span", { class: "chip " + b.cls, text: b.label })),
          el("span", { class: "bartrack" }, el("i", { style: "width:" + Math.round(n / hmax * 100) + "%" })),
          el("span", { class: "barval", text: String(n) })
        ];
        return n ? el("button", {
          class: "barrow" + (on ? " on" : ""), type: "button",
          title: on ? "Show every band again" : "Show only the cases scored " + b.label.toLowerCase(),
          onclick: () => { S.filters.archiveHealth = on ? "" : b.key; renderAll(); }
        }, kids) : el("div", { class: "barrow" }, kids);
      }))
    ]));
  }

  /* A view is the filters you keep coming back to, under a name. It travels
     with the project, because it describes the project, not the browser. */
  const viewBar = el("div", { class: "filterbar" }, [el("span", { class: "small", text: "Views:" })]);
  (S.views || []).forEach((v, i) => viewBar.appendChild(el("span", { class: "viewchip" }, [
    el("button", { type: "button", title: viewSummary(v), onclick: () => applyView(v) }, v.name),
    el("button", { class: "x", type: "button", title: "Forget this view",
      onclick: () => { S.views.splice(i, 1); save(); renderAll(); } }, "\u00d7")
  ])));
  if (!(S.views || []).length) viewBar.appendChild(el("span", { class: "small", text: "none saved yet" }));
  viewBar.appendChild(el("span", { style: "margin-left:auto" }));
  viewBar.appendChild(el("button", {
    class: "btn sm", type: "button", disabled: archiveFilterOn() ? null : "",
    title: archiveFilterOn() ? "Keep these filters under a name" : "Set a filter first",
    onclick: () => {
      const v = currentView();
      const name = window.prompt("Name this view", viewSummary(v));
      if (!clean(name)) return;
      v.name = clean(name).slice(0, 40);
      S.views = (S.views || []).filter(x => x.name !== v.name).concat([v]);
      save(); renderAll();
      toast("View \u201c" + v.name + "\u201d saved.");
    }
  }, "Save this view"));
  p.appendChild(viewBar);

  const types = uniq(S.archive.map(c => c.type));
  const bar = el("div", { class: "filterbar" }, [
    el("input", {
      type: "text", id: "arc-search", placeholder: "Search name, step or module…", value: S.filters.archive,
      oninput: e => { S.filters.archive = e.target.value; renderArchiveTable(); }
    }),
    el("select", {
      id: "arc-type", onchange: e => { S.filters.archiveType = e.target.value; renderArchiveTable(); }
    }, [el("option", { value: "", text: "All types" })].concat(types.map(t => el("option", { value: t, text: t, selected: S.filters.archiveType === t })))),
    S.filters.archiveHealth ? el("span", { class: "pill" }, [
      document.createTextNode("health: " + healthBandByKey(S.filters.archiveHealth).label),
      el("button", { type: "button", title: "Show every band again",
                     onclick: () => { S.filters.archiveHealth = ""; renderAll(); } }, "\u00d7")
    ]) : null,
    el("span", { class: "small", id: "arc-count" }),
    el("button", { class: "btn sm", type: "button", onclick: () => convertArchiveCases(shownArchive().slice(0, 200)) }, "Carry shown over to Review"),
    el("button", { class: "btn ghost sm", type: "button", onclick: () => { pushUndo("removing every test case"); S.archive = []; S.conventions = null; S.archiveHeaders = null; save(); renderAll(); } }, "Remove every test case")
  ]);
  p.appendChild(bar);
  const wrap = el("div", { class: "tablewrap", id: "arc-table" });
  p.appendChild(wrap);
  renderArchiveTable();
}

/* Old projects come in under their own names; this is where they are placed in
   the new tree, one case at a time or in bulk once the suggestions look right. */
function migrationCard() {
  if (!S.moduleTree.length || !S.archive.length) return document.createDocumentFragment();
  const unplaced = S.archive.filter(c => !treeHasPath(c.path));
  const card = el("div", { class: "card" }, [
    el("h3", { text: "Place in the new tree" }),
    el("p", { class: "card-sub", text: "Cases whose path is not a node of the tree — typically everything carried over from an old qTest project. A suggestion is scored two ways: how much the case reads like the cases already at that node, and how much of the node's own distinctive vocabulary it uses." })
  ]);

  if (!unplaced.length) {
    card.appendChild(el("div", { class: "note", text: "Every case sits at a node of the tree." }));
    return card;
  }

  const placed = S.archive.length - unplaced.length;
  if (placed < 5) {
    card.appendChild(el("div", { class: "note", text: "Nothing has been placed yet, so every score here rests on vocabulary alone — and your cases are in German while the tree is in English, which that route cannot bridge. Place one case per branch by hand; the suggestions for its siblings jump immediately." }));
  }

  const thr = S.migrateThreshold || 40;
  card.appendChild(el("div", { class: "filterbar" }, [
    el("span", { class: "chip warn mono", text: unplaced.length + " not placed yet" }),
    el("label", { class: "checkline" }, [
      el("span", { class: "small", text: "Apply the top suggestion from" }),
      el("input", {
        type: "number", min: "10", max: "95", value: String(thr), id: "mig-thr",
        style: "width:72px", onchange: e => { S.migrateThreshold = Number(e.target.value) || 40; save(); renderAll(); }
      }),
      el("span", { class: "small", text: "% upwards" })
    ]),
    el("button", {
      class: "btn sm", type: "button", onclick: () => {
        pushUndo("placing cases in the tree");
        let n = 0;
        unplaced.forEach(c => {
          const top = suggestNodes(c, 1)[0];
          if (top && top.score * 100 >= thr) { c.path = top.path; c.area = pathLeaf(top.path); n++; }
        });
        if (!n) { toast("No suggestion reaches " + thr + "% — lower the threshold or place a few by hand first."); return; }
        buildIdf(); deriveConventions(); save(); renderAll();
        toast(n + " case" + (n === 1 ? "" : "s") + " placed. Re-run it — the ones you just placed teach the rest.");
      }
    }, "Apply to all above the threshold")
  ]));

  const tw = el("div", { class: "tablewrap", style: "max-height:460px; overflow:auto" });
  const t = el("table");
  t.appendChild(el("thead", {}, el("tr", {}, ["Test case", "Comes from", "Belongs at", ""].map(h => el("th", { text: h })))));
  const tb = el("tbody");

  unplaced.slice(0, 60).forEach(c => {
    const sug = suggestNodes(c, 5);
    const best = sug[0];
    const pick = el("select", { style: "min-width:220px" },
      sug.map(x => el("option", {
        value: x.path,
        text: Math.round(x.score * 100) + "% · " + pathLeaf(x.path) +
              (x.examples ? " — " + x.why + ", " + x.examples + " there" : " — " + x.why)
      })).concat(
        [el("option", { value: "", text: "── every node ──", disabled: true })],
        (S.moduleTree || []).map(x => el("option", { value: x, text: pathLeaf(x) }))));

    tb.appendChild(el("tr", {}, [
      el("td", { text: c.name, title: c.name }),
      el("td", { class: "small", text: c.path || c.area || "—" }),
      el("td", {}, [
        pick,
        best ? el("div", { class: "small", style: "margin-top:4px", text: pathSegments({ path: best.path }).slice(0, -1).join(" › ") }) : null
      ]),
      el("td", {}, el("button", {
        class: "btn sm", type: "button", onclick: () => {
          if (!pick.value) return;
          c.path = pick.value; c.area = pathLeaf(pick.value);
          buildIdf(); deriveConventions(); save(); renderAll();
        }
      }, "Place"))
    ]));
  });
  t.appendChild(tb); tw.appendChild(t);
  card.appendChild(tw);
  if (unplaced.length > 60) card.appendChild(el("p", { class: "small", style: "margin-top:8px", text: "Showing the first 60. Place these, then the next batch appears — and scores better for it." }));
  return card;
}

function afterArchiveChange(added, updated, files) {
  buildIdf(); deriveConventions(); save(); renderAll();
  const parts = [];
  if (added) parts.push(added + " new");
  if (updated) parts.push(updated + " updated in place");
  toast((parts.join(", ") || "nothing new") + " from " + files + " file" + (files === 1 ? "" : "s") + ".");
}

const archiveFilterOn = () =>
  !!(S.filters.archive || S.filters.archiveType || S.filters.archiveArea || S.filters.archiveHealth);
const currentView = () => ({
  name: "", q: S.filters.archive, type: S.filters.archiveType,
  area: S.filters.archiveArea, health: S.filters.archiveHealth
});
function viewSummary(v) {
  const bits = [v.area, v.type, v.health ? healthBandByKey(v.health).label : "", v.q ? "\u201c" + v.q + "\u201d" : ""];
  return bits.filter(Boolean).join(" \u00b7 ") || "everything";
}
function applyView(v) {
  S.filters.archive = v.q || "";
  S.filters.archiveType = v.type || "";
  S.filters.archiveArea = v.area || "";
  S.filters.archiveHealth = v.health || "";
  renderAll();
  toast("View \u201c" + v.name + "\u201d \u2014 " + shownArchive().length + " cases.");
}

function shownArchive() {
  const q = S.filters.archive.toLowerCase();
  return S.archive.filter(c => {
    if (S.filters.archiveArea && pathSegments(c).indexOf(S.filters.archiveArea) < 0) return false;
    if (S.filters.archiveType && c.type !== S.filters.archiveType) return false;
    if (S.filters.archiveHealth && healthOf(c).band.key !== S.filters.archiveHealth) return false;
    if (!q) return true;
    return (c.name + " " + (c.path || c.area) + " " + c.module + " " + c.tags + " " + c.steps.map(s => s.action).join(" ")).toLowerCase().indexOf(q) >= 0;
  });
}

function renderArchiveTable() {
  const wrap = $("#arc-table"); if (!wrap) return;
  const list = shownArchive();
  const cnt = $("#arc-count"); if (cnt) cnt.textContent = list.length + " of " + S.archive.length + " shown";
  wrap.textContent = "";
  const t = el("table");
  t.appendChild(el("thead", {}, el("tr", {}, ["ID", "Name", "Area", "Module", "Type", "Priority", "Health", "Steps"].map(h =>
    el("th", { text: h, class: h === "Steps" ? "num" : "" })))));
  const tb = el("tbody");
  list.slice(0, 400).forEach(c => {
    const tr = el("tr", { style: "cursor:pointer", onclick: () => showArchiveCase(c) }, [
      el("td", { class: "id", text: c.tcid }),
      el("td", { text: c.name }),
      el("td", { text: c.area || "—", title: c.path || "" }),
      el("td", { text: c.module || "—" }),
      el("td", {}, c.type ? el("span", { class: "chip", text: c.type }) : document.createTextNode("—")),
      el("td", { text: c.priority || "—" }),
      el("td", {}, healthChip(healthOf(c))),
      el("td", { class: "num", text: String(c.steps.length) })
    ]);
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  wrap.appendChild(t);
  if (list.length > 400) wrap.appendChild(el("p", { class: "small", style: "padding:8px 11px", text: "Showing the first 400 rows — narrow the search to see the rest. All " + S.archive.length + " cases are indexed for matching." }));
}

function escapeHtml(s) { return esc(s).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m])); }

/* ---------------------------------------------------- stage: requirements */
function viewRequirements(p) {
  p.appendChild(head("Requirements for this release",
    "Jira search results as CSV or Excel, the XML from a single issue or a whole filter, or the JSON that /rest/api/3/search returns. Acceptance criteria are split into individually testable items."));

  const importCard = el("div", { class: "card" }, [el("h3", { text: "Import" })]);
  const file = el("input", { type: "file", id: "req-file", accept: ".xlsx,.xls,.xlsm,.csv,.tsv,.txt,.json,.xml", multiple: true });
  file.addEventListener("change", async e => {
    const files = Array.from(e.target.files || []);
    let added = 0;
    for (const f of files) {
      try {
        const reqs = await parseRequirementFile(f);
        S.requirements = S.requirements.concat(reqs);
        added += reqs.length;
      } catch (err) { toast("Could not read " + f.name + ": " + err.message); }
    }
    buildIdf(); save(); renderAll();
    toast(added + " requirement" + (added === 1 ? "" : "s") + " imported.");
    e.target.value = "";
  });
  const acFieldIn = el("input", {
    type: "text", id: "ac-field", placeholder: "customfield_10101", value: S.jiraAcField
  });
  acFieldIn.addEventListener("input", e => { S.jiraAcField = clean(e.target.value); save(); });

  importCard.appendChild(el("div", { class: "stack" }, [
    file,
    el("label", { class: "field" }, [
      el("span", { text: "Acceptance-criteria field — only needed for JSON without field names; XML finds it by its label" }),
      acFieldIn
    ]),
    el("details", { class: "raw" }, [
      el("summary", { text: "…or paste Jira CSV, XML or JSON here" }),
      el("textarea", { id: "req-paste", placeholder: 'Issue key,Summary,Description,Custom field (Acceptance Criteria),Components,Fix Version/s\n\n…or <rss>…</rss> from Jira\u2019s XML export, or {"issues":[…]} from /rest/api/3/search' }),
      el("div", { class: "row", style: "margin-top:8px" }, [
        el("button", {
          class: "btn primary sm", type: "button", onclick: () => {
            const t = $("#req-paste").value;
            if (!clean(t)) { toast("Nothing pasted yet."); return; }
            try {
              const trimmed = t.trim();
              const reqs = /^[\[{]/.test(trimmed) ? ingestJiraJson(t)
                         : /^<(\?xml|rss|item)/i.test(trimmed) ? ingestJiraXml(t)
                         : ingestRequirementRows(parseDelimited(t));
              S.requirements = S.requirements.concat(reqs);
              buildIdf(); save(); renderAll();
              toast(reqs.length + " requirement" + (reqs.length === 1 ? "" : "s") + " imported.");
            } catch (err) { toast("Could not parse that: " + err.message); }
          }
        }, "Add requirements")
      ])
    ])
  ]));

  const manualCard = el("div", { class: "card" }, [
    el("h3", { text: "Add a single ticket" }),
    el("p", { class: "card-sub", text: "For the one story that never makes it into the export." })
  ]);
  manualCard.appendChild(el("div", { class: "stack" }, [
    el("label", { class: "field" }, [el("span", { text: "Issue key" }), el("input", { type: "text", id: "m-key", placeholder: "PROJ-1234" })]),
    el("label", { class: "field" }, [el("span", { text: "Summary" }), el("input", { type: "text", id: "m-sum", placeholder: "Bulk price update for customer-specific price lists" })]),
    el("label", { class: "field" }, [el("span", { text: "Description / acceptance criteria" }), el("textarea", { id: "m-desc", placeholder: "- The buyer can upload a CSV with up to 5000 rows\n- Invalid rows are rejected with a line number\nGiven a valid file\nWhen the buyer confirms the import\nThen the new prices are active" })]),
    el("div", { class: "row" }, [
      el("button", {
        class: "btn primary sm", type: "button", onclick: () => {
          const key = clean($("#m-key").value) || "REQ-" + (S.requirements.length + 1);
          const sum = clean($("#m-sum").value);
          if (!sum) { toast("A summary is required."); return; }
          S.requirements.push(buildRequirement({
            key, summary: sum, description: $("#m-desc").value, acRaw: "",
            issuetype: "Story", priority: "", epic: "", labels: "", components: "", fixVersion: ""
          }));
          buildIdf(); save(); renderAll(); toast(key + " added.");
        }
      }, "Add requirement")
    ])
  ]));

  p.appendChild(el("div", { class: "split" }, [importCard, manualCard]));

  if (!S.requirements.length) {
    p.appendChild(el("div", { class: "empty", text: "No requirements yet. Import a Jira CSV, paste JSON, or add a ticket by hand." }));
    return;
  }

  p.appendChild(el("div", { class: "row" }, [
    el("span", { class: "small", text: S.requirements.length + " requirements · " + S.requirements.reduce((n, r) => n + r.ac.length, 0) + " acceptance criteria" }),
    el("button", { class: "btn ghost sm", type: "button", onclick: () => { pushUndo("removing the requirements"); S.requirements = []; buildIdf(); save(); renderAll(); } }, "Remove all requirements")
  ]));

  S.requirements.forEach((r, ri) => {
    const card = el("div", { class: "reqcard", id: "req-" + r.key });
    card.appendChild(el("header", {}, [
      el("span", { class: "key", text: r.key }),
      el("span", { class: "sum", text: r.summary }),
      r.issuetype ? el("span", { class: "chip", text: r.issuetype }) : null,
      r.fixVersion ? el("span", { class: "chip accent", text: r.fixVersion }) : null,
      el("button", { class: "btn ghost sm", type: "button", onclick: () => { S.requirements.splice(ri, 1); save(); renderAll(); } }, "Remove")
    ]));
    const body = el("div", { class: "body" });
    if (r.components || r.labels) body.appendChild(el("div", { class: "row" }, uniq((r.components + "," + r.labels).split(",").map(clean)).map(c => el("span", { class: "chip", text: c }))));
    if (!r.ac.length) body.appendChild(el("div", { class: "note warn", text: "No acceptance criteria could be read from this ticket. Add them below — without them only a thin functional case can be forged." }));
    const ul = el("ul", { class: "aclist" });
    r.ac.forEach((ac, i) => ul.appendChild(el("li", {}, [
      el("span", { class: "acn", text: "AC" + (i + 1) }),
      el("span", { style: "flex:1;min-width:0" }, [
        document.createTextNode(ac.text),
        el("div", { class: "row", style: "margin-top:5px" }, ac.techniques.map(k => el("span", { class: "chip accent", text: techName(k, genLangFor(r)) })))
      ]),
      el("button", { class: "btn ghost sm", type: "button", onclick: () => { r.ac.splice(i, 1); save(); renderAll(); } }, "×")
    ])));
    body.appendChild(ul);
    const addIn = el("input", { type: "text", placeholder: "Add an acceptance criterion…" });
    addIn.addEventListener("keydown", e => {
      if (e.key !== "Enter" || !clean(addIn.value)) return;
      r.ac.push(makeAc(addIn.value)); save(); renderAll();
    });
    body.appendChild(el("label", { class: "field" }, [el("span", { text: "Add criterion (Enter to confirm)" }), addIn]));
    if (r.description) body.appendChild(el("details", { class: "raw" }, [
      el("summary", { text: "Original ticket text" }),
      el("p", { class: "small", style: "white-space:pre-wrap", text: r.description })
    ]));
    card.appendChild(body);
    p.appendChild(card);
  });
}

/* ----------------------------------------------------------- stage: match */
function viewMatch(p) {
  p.appendChild(head("Match against the knowledge base",
    S.history.length
      ? "Two routes to a template. Directly: the requirement text against each archived case. Through history: the requirement against each past requirement, then the cases that covered it — a green “via” chip marks those, and where the link exists it carries most of the weight."
      : "Each requirement is scored against every archived case with TF-IDF similarity plus a trigram check on the title. Add past requirements on the Knowledge Base stage and matching also runs requirement-to-requirement, which is the steadier signal."));

  if (!S.archive.length || !S.requirements.length) {
    p.appendChild(el("div", { class: "empty", text: "Matching needs a knowledge base and at least one requirement for this release." }));
    return;
  }
  buildIdf();

  p.appendChild(el("div", { class: "card tight" }, el("label", { class: "field" }, [
    el("span", { text: "Minimum similarity to accept a template (" + Math.round(S.gen.minScore * 100) + "%)" }),
    el("input", {
      type: "range", min: "0", max: "60", value: String(Math.round(S.gen.minScore * 100)), id: "minscore",
      onchange: e => { S.gen.minScore = Number(e.target.value) / 100; save(); renderAll(); }
    })
  ])));

  S.requirements.forEach(r => {
    const ms = matchesFor(r, 5);
    const card = el("div", { class: "reqcard" });
    const best = ms[0] ? Math.round(ms[0].score * 100) : 0;
    const areaList = (S.conventions && S.conventions.areas) || [];
    const areaSel = el("select", { id: "area-" + r.key, style: "width:auto;min-width:150px" },
      [el("option", { value: "", text: "Anywhere in the tree", selected: !r.area })].concat(
        areaList.map(a => el("option", { value: a, text: a, selected: r.area === a }))));
    areaSel.addEventListener("change", e => { r.area = e.target.value; r.selectedTemplate = null; buildIdf(); save(); renderAll(); });

    card.appendChild(el("header", {}, [
      el("span", { class: "key", text: r.key }),
      el("span", { class: "sum", text: r.summary }),
      areaList.length ? areaSel : null,
      el("span", { class: "chip " + (best >= 45 ? "good" : best >= 20 ? "warn" : "crit"), text: "best match " + best + "%" })
    ]));
    const body = el("div", { class: "body" });
    if (!ms.length || ms[0].score < S.gen.minScore) {
      body.appendChild(el("div", { class: "note warn", text: "Nothing in the archive is close enough. Cases will be forged from the acceptance criteria alone, with your naming convention and standard steps still applied." }));
    }
    ms.forEach((m, i) => {
      const sel = r.selectedTemplate ? r.selectedTemplate === m.tc.tcid : i === 0;
      const row = el("label", { class: "matchrow" + (sel ? " top" : "") }, [
        el("input", {
          type: "radio", name: "tpl-" + r.key, checked: sel,
          onchange: () => { r.selectedTemplate = m.tc.tcid; save(); renderAll(); }
        }),
        el("span", { class: "mono small", text: m.tc.tcid }),
        el("span", { class: "nm", text: m.tc.name }),
        m.tc.type ? el("span", { class: "chip", text: m.tc.type }) : null,
        m.via > 0 ? el("span", { class: "chip good mono", text: "via " + m.viaKey + " · " + Math.round(m.via * 100) + "%" }) : null,
        el("span", { class: "score", text: Math.round(m.score * 100) + "%" }),
        el("span", { class: "bar" }, el("i", { style: "width:" + Math.round(m.score * 100) + "%" })),
        el("span", { class: "small", text: m.tc.steps.length + " steps" })
      ]);
      body.appendChild(row);
    });
    card.appendChild(body);
    p.appendChild(card);
  });
}

/* -------------------------------------------------------- stage: generate */

      el("label", { class: "field" }, [

        })
      ]),

        : el("p", { class: "small", text: "No repeated opening step found in the archive yet." }),
      conv.epilogue && conv.epilogue.length

  }
  p.appendChild(pv);
}

/* ---------------------------------------------------------- stage: review */
function viewReview(p) {
  p.appendChild(head("Review and edit",
    "Nothing here is final. Fix the wording, drop what you do not need, approve what goes to qTest. “Needs wording” means the ticket never said what the expected result is; a red “≈ TC-…” chip means the archive already holds something very close, which is usually a case to extend rather than a case to add."));

  if (!S.drafts.length) {
    p.appendChild(el("div", { class: "empty" }, [
      el("p", { text: "No drafts yet." }),
      el("div", { class: "row", style: "justify-content:center;margin-top:10px" }, [
        el("button", { class: "btn sm", type: "button", onclick: () => { S.stage = "generate"; renderAll(); } }, "Go to Generate")
      ])
    ]));

  }

  const FLAG_LABEL = {
    needsWording: "needs wording", duplicate: "close to an archived case",
