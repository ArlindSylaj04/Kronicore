      el("button", { type: "button", title: "Remove this filter", onclick: () => { S.filters[key] = ""; renderAll(); } }, "×")
    ]));
    if (S.filters.draftReq) pill(S.filters.draftReq, "draftReq");
    if (S.filters.draftTech) pill(techName(S.filters.draftTech, genLangFor(null)), "draftTech");
    if (S.filters.draftModule) pill(S.filters.draftModule, "draftModule");
    if (S.filters.draftFlag) pill(FLAG_LABEL[S.filters.draftFlag] || S.filters.draftFlag, "draftFlag");
    pills.appendChild(el("button", { class: "btn ghost sm", type: "button",
      onclick: () => { clearDraftFilters(); renderAll(); } }, "Show everything"));
    p.appendChild(pills);
  }

  const dupCount = S.drafts.filter(d => d.similar).length;
  p.appendChild(el("div", { class: "filterbar" }, [
    el("input", {
      type: "text", id: "dr-search", placeholder: "Filter drafts…", value: S.filters.drafts,
      oninput: e => { S.filters.drafts = e.target.value; renderDraftList(); }
    }),
    el("button", { class: "btn sm", type: "button", onclick: () => { pushUndo("approving all shown"); shownDrafts().forEach(d => { if (d.review !== "rejected") d.review = "approved"; }); save(); renderAll(); } }, "Approve all shown"),
    el("button", { class: "btn ghost sm", type: "button", onclick: () => { pushUndo("discarding unapproved drafts"); S.drafts = S.drafts.filter(d => d.review === "approved"); save(); renderAll(); } }, "Discard unapproved"),
    el("button", { class: "btn ghost sm", type: "button", onclick: () => { flagDuplicates(); save(); renderAll(); toast("Checked every draft against the archive."); } }, "Check against the archive"),
    el("label", { class: "checkline", title: "Select every draft the filters currently show" }, [
      el("input", { type: "checkbox", id: "pick-all", onchange: e => {
        const shown = shownDrafts();
        shown.forEach(d => { if (e.target.checked) PICKED.add(d.uid); else PICKED.delete(d.uid); });
        renderDraftList(); renderBulkBar();
      } }),
      el("span", { class: "small", text: "Select all shown" })
    ]),
    dupCount ? el("button", { class: "btn sm", type: "button",
      onclick: () => goto("review", { draftFlag: "duplicate" }) },
      dupCount + " close to an archived case") : null,
    el("span", { class: "small", id: "dr-count" })
  ]));

  // Sixteen drafts fit on a page; a hundred do not. These two decide the shape.
  p.appendChild(el("div", { class: "filterbar" }, [
    el("label", { class: "field", style: "flex-direction:row;align-items:center;gap:6px" }, [
      el("span", { text: "Group by" }),
      el("select", { id: "dr-group", onchange: e => { S.review.group = e.target.value; save(); renderAll(); } },
        [["", "nothing"], ["requirement", "requirement"], ["module", "module"], ["technique", "technique"],
         ["review", "review state"]].map(o =>
          el("option", { value: o[0], text: o[1], selected: S.review.group === o[0] })))
    ]),
    el("label", { class: "checkline", title: "Show only the header of each draft" }, [
      el("input", { type: "checkbox", id: "dr-compact", checked: S.review.compact ? "" : null,
        onchange: e => { S.review.compact = e.target.checked; OPEN_DRAFTS.clear(); save(); renderAll(); } }),
      el("span", { class: "small", text: "Compact" })
    ]),
    el("span", { style: "margin-left:auto" }),
    el("button", { class: "btn ghost sm", type: "button", title: "Keyboard shortcuts",
      onclick: () => { SHOW_KEYS = !SHOW_KEYS; renderAll(); } }, SHOW_KEYS ? "Hide keys" : "Keys")
  ]));
  if (SHOW_KEYS) p.appendChild(keyHelpCard());

  p.appendChild(el("div", { class: "bulkbar", id: "bulkbar", hidden: true }));
  p.appendChild(el("div", { class: "stack", id: "draft-list" }));
  renderDraftList();
  renderBulkBar();
}

/* One decision applied to many drafts. Every one of these takes a snapshot
   first, because a bulk action is exactly the kind you want back. */
function renderBulkBar() {
  const host = $("#bulkbar");
  if (!host) return;
  prunePicked();
  const list = pickedDrafts();
  host.textContent = "";
  host.hidden = !list.length;
  if (!list.length) return;

  const conv = S.conventions || {};
  const run = (label, fn) => {
    pushUndo(label + " in bulk");
    fn(list);
    save(); renderAll();
    toast(list.length + (list.length === 1 ? " draft " : " drafts ") + label + ".");
  };
  const btn = (text, label, fn, cls) => el("button", {
    class: "btn sm " + (cls || ""), type: "button", onclick: () => run(label, fn)
  }, text);

  const setter = (label, key, options) => {
    const sel = el("select", { title: "Set the " + label.toLowerCase() + " of every selected draft" },
      [el("option", { value: "", text: label + "\u2026", selected: true })].concat(
        uniq(options).sort().map(o => el("option", { value: o, text: o }))));
    sel.addEventListener("change", e => {
      const v = e.target.value;
      if (!v) return;
      run("set to " + v, l => l.forEach(d => { d[key] = v; }));
    });
    return sel;
  };

  host.appendChild(el("span", { class: "count", text: list.length + " selected" }));
  host.appendChild(btn("Approve", "approved", l => l.forEach(d => { d.review = "approved"; }), "primary"));
  host.appendChild(btn("Back to draft", "put back to draft", l => l.forEach(d => { d.review = "draft"; })));
  host.appendChild(btn("Drop", "dropped", l => l.forEach(d => { d.review = "rejected"; })));
  host.appendChild(setter("Module", "module", (conv.modules || []).concat(S.drafts.map(d => d.module))));
  host.appendChild(setter("Priority", "priority", (conv.priorities || []).concat(S.drafts.map(d => d.priority))));
  host.appendChild(setter("Status", "status", (conv.statuses || []).concat(S.drafts.map(d => d.status))));
  host.appendChild(setter("Type", "type", (conv.types || []).concat(S.drafts.map(d => d.type))));
  host.appendChild(el("span", { style: "margin-left:auto" }));
  host.appendChild(el("button", { class: "btn ghost sm", type: "button",
    title: "Remove them from the project — Drop only marks them rejected",
    onclick: () => run("deleted", l => {
      const gone = new Set(l.map(d => d.uid));
      S.drafts = S.drafts.filter(d => !gone.has(d.uid));
    }) }, "Delete"));
  host.appendChild(el("button", { class: "btn ghost sm", type: "button",
    onclick: () => { PICKED.clear(); renderAll(); } }, "Clear selection"));
}

function shownDrafts() {
  const f = S.filters, q = f.drafts.toLowerCase();
  return S.drafts.filter(d => {
    if (f.draftReq && d.requirement !== f.draftReq) return false;
    if (f.draftTech && d.technique !== f.draftTech) return false;
    if (f.draftModule && (d.module || "(no module)") !== f.draftModule) return false;
    if (f.draftFlag === "needsWording" && !(d.needsWording && d.review === "draft")) return false;
    if (f.draftFlag === "duplicate" && !d.similar) return false;
    if (f.draftFlag === "approved" && d.review !== "approved") return false;
    if (f.draftFlag === "open" && d.review !== "draft") return false;
    if (q && (d.name + " " + d.requirement + " " + d.technique).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}
const draftFilterOn = () =>
  !!(S.filters.draftReq || S.filters.draftTech || S.filters.draftModule || S.filters.draftFlag);
function clearDraftFilters() {
  S.filters.draftReq = S.filters.draftTech = S.filters.draftModule = S.filters.draftFlag = "";
}

/* A number is a way into what it counted: every figure on a tile, every cell of
   the matrix and every bar hands its own slice to the stage that can act on it. */
let PENDING_SCROLL = "";
function goto(stage, filters, scrollTo) {
  clearDraftFilters();
  PICKED.clear();
  if (filters) Object.keys(filters).forEach(k => { S.filters[k] = filters[k]; });
  S.stage = stage;
  PENDING_SCROLL = scrollTo || "";
  renderAll();
  if (!scrollTo) window.scrollTo({ top: 0, behavior: "smooth" });
}
function runPendingScroll() {
  if (!PENDING_SCROLL) return;
  const target = document.getElementById(PENDING_SCROLL);
  PENDING_SCROLL = "";
  if (target) target.scrollIntoView({ behavior: "smooth", block: "center" });
}

const GROUP_OF = {
  requirement: d => d.requirement || "(no requirement)",
  module:      d => d.module || "(no module)",
  technique:   d => techName(d.technique, d.lang || "en"),
  review:      d => d.review === "approved" ? "Approved" : d.review === "rejected" ? "Dropped" : "Still draft"
};

function renderDraftList() {
  const box = $("#draft-list"); if (!box) return;
  const list = shownDrafts();
  const cnt = $("#dr-count");
  if (cnt) cnt.textContent = list.length + " of " + S.drafts.length + " shown";
  box.textContent = "";
  const conv = S.conventions || {};
  const by = GROUP_OF[S.review.group];

  if (!by) {
    list.forEach(d => box.appendChild(draftCard(d, conv)));
  } else {
    const order = [], bucket = {};
    list.forEach(d => {
      const k = by(d);
      if (!bucket[k]) { bucket[k] = []; order.push(k); }
      bucket[k].push(d);
    });
    order.forEach(k => {
      const mine = bucket[k];
      const ok = mine.filter(d => d.review === "approved").length;
      const g = el("details", { class: "dgroup", open: order.length <= 8 ? "" : null });
      g.appendChild(el("summary", {}, [
        el("span", { class: "tw" }),
        el("span", { class: "gname", text: k }),
        el("span", { class: "chip mono", text: mine.length + (mine.length === 1 ? " draft" : " drafts") }),
        el("span", { class: "chip " + (ok === mine.length ? "good" : ok ? "warn" : ""), text: ok + " approved" }),
        el("button", { class: "btn sm", type: "button", title: "Select every draft in this group",
          onclick: e => {
            e.preventDefault(); e.stopPropagation();
            mine.forEach(d => PICKED.add(d.uid));
            renderDraftList(); renderBulkBar();
          } }, "Select these")
      ]));
      const gb = el("div", { class: "gbody" });
      mine.forEach(d => gb.appendChild(draftCard(d, conv)));
      g.appendChild(gb);
      box.appendChild(g);
    });
  }

  const all = $("#pick-all");
  if (all) all.checked = list.length > 0 && list.every(d => PICKED.has(d.uid));
  paintCursor();
}

/* ---- keyboard: a hundred drafts are not a hundred mouse trips ------------ */
let OPEN_DRAFTS = new Set();   // which cards are expanded while Compact is on
let CURSOR = "";               // the draft the keys act on
let SHOW_KEYS = false;

const KEYS = [
  ["j / \u2193", "next draft"], ["k / \u2191", "previous draft"],
  ["a", "approve or un-approve it"], ["x", "drop or restore it"],
  ["o / \u21b5", "fold it open or shut"], ["space", "select it for a bulk action"],
  ["/", "jump to the filter box"], ["Ctrl + K", "search everything"],
  ["Ctrl + S", "save the project"], ["Esc", "close, or drop the cursor"]
];
function keyHelpCard() {
  return el("div", { class: "card tight" }, [
    el("h3", { text: "Keyboard", style: "margin-bottom:8px" }),
    el("p", { class: "card-sub", text: "The single letters work while the cursor is on a card and you are not typing in a field." }),
    el("div", { class: "keyhelp" }, KEYS.map(k =>
      el("div", {}, [el("kbd", { text: k[0] }), el("span", { text: k[1] })])))
  ]);
}

function paintCursor() {
  document.querySelectorAll(".draft.cursor").forEach(x => x.classList.remove("cursor"));
  if (!CURSOR) return;
  const c = document.getElementById("d-" + CURSOR);
  if (c) c.classList.add("cursor");
}
function moveCursor(by) {
  const list = shownDrafts();
  if (!list.length) return;
  let i = list.findIndex(d => d.uid === CURSOR);
  i = i < 0 ? (by > 0 ? 0 : list.length - 1) : Math.min(list.length - 1, Math.max(0, i + by));
  CURSOR = list[i].uid;
  paintCursor();
  const c = document.getElementById("d-" + CURSOR);
  if (c) {
    // a card inside a shut group is a cursor you cannot see
    const g = c.closest("details.dgroup");
    if (g && !g.open) { g.open = true; }
    c.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
}
const cursorDraft = () => S.drafts.filter(d => d.uid === CURSOR)[0];

function refreshReview() { renderRail(); renderKpis(); renderDraftList(); renderBulkBar(); }

function draftCard(d, conv) {
  const folded = S.review.compact && !OPEN_DRAFTS.has(d.uid);
  const card = el("div", { id: "d-" + d.uid, class: "draft "
    + (d.review === "approved" ? "approved " : d.review === "rejected" ? "rejected " : "")
    + (PICKED.has(d.uid) ? "picked " : "") + (folded ? "compact " : "")
    + (CURSOR === d.uid ? "cursor" : "") });
  const health = healthOf(d, true);
  const cmpId = comparableId(d);

  const pick = el("input", { type: "checkbox", class: "pick",
    title: "Select this draft for a bulk action", checked: PICKED.has(d.uid) ? "" : null });
  pick.addEventListener("change", e => {
    if (e.target.checked) PICKED.add(d.uid); else PICKED.delete(d.uid);
    card.classList.toggle("picked", e.target.checked);
    renderBulkBar();
    const all = $("#pick-all");
    if (all) { const sh = shownDrafts(); all.checked = sh.length > 0 && sh.every(x => PICKED.has(x.uid)); }
  });

  const title = el("input", { class: "title-in", type: "text", value: d.name, id: "n-" + d.uid });
  title.addEventListener("input", e => { d.name = e.target.value; save(); });

  card.appendChild(el("header", {}, [
    pick,
    S.review.compact ? el("button", {
      class: "fold", type: "button", title: folded ? "Open this draft" : "Fold this draft",
      onclick: () => { toggleFold(d); }
    }, folded ? "\u25b8" : "\u25be") : null,
    (d.origin === "archive" || !d.requirement)
      ? el("span", { class: "grip", text: d.origin === "archive" ? "archive · " + d.templateId : "—" })
      : el("button", { class: "chip mono", type: "button", title: "Open " + d.requirement,
          onclick: () => goto("requirements", null, "req-" + d.requirement) },
          d.requirement + (d.acRef ? " · " + d.acRef : "")),
    title,
    d.needsWording ? el("span", { class: "chip warn", text: "needs wording" }) : null,
    d.similar ? el("button", {
      class: "chip crit mono", type: "button", style: "cursor:pointer",
      title: "Closest archived case: " + d.similar.name + " \u2014 see the two side by side",
      onclick: () => showCompare(d)
    }, "\u2248 " + d.similar.tcid + " \u00b7 " + d.similar.score + "%") : null,
    el("span", { class: "chip accent", text: techName(d.technique, d.lang || "en") }),
    healthChip(health),
    el("button", {
      class: "btn sm " + (d.review === "approved" ? "primary" : ""), type: "button",
      onclick: () => { d.review = d.review === "approved" ? "draft" : "approved"; save(); refreshReview(); }
    }, d.review === "approved" ? "Approved" : "Approve"),
    el("button", {
      class: "btn ghost sm", type: "button",
      onclick: () => { d.review = d.review === "rejected" ? "draft" : "rejected"; save(); refreshReview(); }
    }, d.review === "rejected" ? "Restore" : "Drop")
  ]));

  const body = el("div", { class: "body" });

  // what stands between this draft and a case you would sign off, spelled out
  const missing = health.checks.filter(k => k.state === "warn" || k.state === "crit");
  if (missing.length) {
    body.appendChild(el("details", { class: "raw" }, [
      el("summary", { text: missing.length === 1
        ? "1 thing this case is still missing" : missing.length + " things this case is still missing" }),
      healthList(missing)
    ]));
  }

  const sel = (label, key, options) => {
    const s = el("select", { id: key + "-" + d.uid });
    uniq(options.concat(d[key] ? [d[key]] : [])).forEach(o => s.appendChild(el("option", { value: o, text: o, selected: d[key] === o })));
    s.addEventListener("change", e => { d[key] = e.target.value; save(); });
    return el("label", { class: "field" }, [el("span", { text: label }), s]);
  };
  const txt = (label, key) => {
    const i = el("input", { type: "text", value: d[key] || "", id: key + "-" + d.uid });
    i.addEventListener("input", e => { d[key] = e.target.value; save(); });
    return el("label", { class: "field" }, [el("span", { text: label }), i]);
  };

  body.appendChild(el("div", { class: "metagrid" }, [
    sel("Area", "area", conv.areas || []),
    txt("Module path", "path"),
    sel("Module", "module", conv.modules || []),
    sel("Type", "type", conv.types || ["Functional", "End-to-End"]),
    sel("Priority", "priority", conv.priorities || ["High", "Medium", "Low"]),
    sel("Status", "status", conv.statuses || ["New"]),
    txt("Requirement", "requirement"),
    archiveLabels().tags ? txt(archiveLabels().tags, "tags") : null
  ]));

  const custom = (conv.extra || []).filter(f => f.fill >= 0.2);
  if (custom.length) {
    d.extra = d.extra || {};
    body.appendChild(el("p", { class: "small", text: "Your project's own qTest fields, prefilled with the value your archive uses most:" }));
    body.appendChild(el("div", { class: "metagrid" }, custom.map(f => {
      let input;
      if (f.values.length && f.values.length <= 12) {
        input = el("select", { id: "x-" + d.uid + "-" + norm(f.name) },
          [el("option", { value: "", text: "—", selected: !d.extra[f.name] })].concat(
            f.values.map(v => el("option", { value: v, text: v, selected: d.extra[f.name] === v }))));
      } else {
        input = el("input", { type: "text", id: "x-" + d.uid + "-" + norm(f.name), value: d.extra[f.name] || "" });
      }
      input.addEventListener("change", e => { d.extra[f.name] = e.target.value; save(); });
      input.addEventListener("input", e => { d.extra[f.name] = e.target.value; save(); });
      return el("label", { class: "field" }, [el("span", { text: f.name }), input]);
    })));
  }

  const pre = el("textarea", { id: "pc-" + d.uid, style: "min-height:56px" });
  pre.value = d.precondition || "";
  pre.addEventListener("input", e => { d.precondition = e.target.value; d.needsWording = false; save(); });
  body.appendChild(el("label", { class: "field" }, [el("span", { text: "Precondition" }), pre]));

  const tw = el("div", { class: "tablewrap" });
  const t = el("table", { class: "steps" });
  t.appendChild(el("thead", {}, el("tr", {}, [el("th", { text: "#" }), el("th", { text: "Action" }), el("th", { text: "Expected result" }), el("th", { class: "acts", text: "" })])));
  const tb = el("tbody");
  d.steps.forEach((s, i) => {
    const a = el("textarea", { id: "sa-" + d.uid + "-" + i }); a.value = s.action;
    a.addEventListener("input", e => { s.action = e.target.value; save(); });
    const x = el("textarea", { id: "sx-" + d.uid + "-" + i }); x.value = s.expected;
    x.addEventListener("input", e => { s.expected = e.target.value; d.needsWording = false; save(); });
    const act = (glyph, title, fn, cls, off) => el("button", {
      class: "stepbtn " + (cls || ""), type: "button", title: title,
      disabled: off ? "" : null, onclick: fn
    }, glyph);
    tb.appendChild(el("tr", {}, [
      el("td", { class: "id", text: String(i + 1) }),
      el("td", {}, a),
      el("td", {}, x),
      el("td", { class: "acts" }, [
        act("\u2191", "Move this step up", () => moveStep(d, i, -1), "", i === 0),
        act("\u2193", "Move this step down", () => moveStep(d, i, 1), "", i === d.steps.length - 1),
        act("\u29c9", "Duplicate this step", () => {
          pushUndo("duplicating a step");
          d.steps.splice(i + 1, 0, { action: s.action, expected: s.expected });
          save(); refreshDraft(d);
        }),
        act("\u00d7", "Delete this step", () => {
          pushUndo("deleting a step");
          d.steps.splice(i, 1); save(); refreshDraft(d);
        }, "danger")
      ])
    ]));
  });
  t.appendChild(tb); tw.appendChild(t);
  body.appendChild(tw);

  body.appendChild(el("div", { class: "row" }, [
    el("button", { class: "btn sm", type: "button", onclick: () => {
      d.steps.push({ action: "", expected: "" }); save(); refreshDraft(d);
      const t2 = document.getElementById("sa-" + d.uid + "-" + (d.steps.length - 1));
      if (t2) t2.focus();
    } }, "Add step"),
    cmpId ? el("button", { class: "btn sm", type: "button",
      title: d.similar
        ? "See this draft and " + cmpId + " field by field"
        : "See what the generator kept from " + cmpId + " and what it wrote itself",
      onclick: () => showCompare(d, cmpId) }, "Compare with " + cmpId) : null,
    d.templateId ? el("span", { class: "small", style: "margin-left:auto", text: "Derived from " + d.templateId + " · " + d.templateName + " (" + d.templateScore + "% match)" }) : null
  ]));

  card.appendChild(body);
  return card;
}

/* ---- what the bulk actions act on ---------------------------------------- */
/* A selection belongs to the sitting, not to the project, so it is never
   written to the project file and never survives a stage change. */
let PICKED = new Set();
const pickedDrafts = () => S.drafts.filter(d => PICKED.has(d.uid));
function prunePicked() {
  const live = new Set(S.drafts.map(d => d.uid));
  Array.from(PICKED).forEach(u => { if (!live.has(u)) PICKED.delete(u); });
}

/* Re-render one card in place. Rebuilding the whole list on every step edit
   throws away the scroll position and the field you were typing into. */
function refreshDraft(d) {
  const old = document.getElementById("d-" + d.uid);
  if (!old) { refreshReview(); return; }
  old.replaceWith(draftCard(d, S.conventions || {}));
  renderRail(); renderKpis(); renderUndo(); renderBulkBar();
}

function moveStep(d, i, by) {
  const j = i + by;
  if (j < 0 || j >= d.steps.length) return;
  const keep = d.steps[i];
  d.steps[i] = d.steps[j];
  d.steps[j] = keep;
  save(); refreshDraft(d);
  const t = document.getElementById("sa-" + d.uid + "-" + j);
  if (t) t.focus();
}

/* ---- the same case twice, side by side ----------------------------------- */
/* A duplicate flag is only worth having if you can see what actually differs,
   and two test cases that differ in one number look identical in a line-level
   diff — so this one works on words. */
const DIFF_BUDGET = 250000;   // beyond that the quadratic table is not worth it

function diffWords(a, b) {
  const A = String(a == null ? "" : a).split(/(\s+)/);
  const B = String(b == null ? "" : b).split(/(\s+)/);
  const n = A.length, m = B.length;
  const L = [];
  for (let i = 0; i <= n; i++) L.push(new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--)
    for (let j = m - 1; j >= 0; j--)
      L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);

  const left = [], right = [];
  const push = (arr, kind, text) => {
    const last = arr[arr.length - 1];
    if (last && last.kind === kind) last.text += text; else arr.push({ kind: kind, text: text });
  };
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (A[i] === B[j]) { push(left, "same", A[i]); push(right, "same", B[j]); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) { push(left, "del", A[i]); i++; }
    else { push(right, "ins", B[j]); j++; }
  }
  while (i < n) { push(left, "del", A[i]); i++; }
  while (j < m) { push(right, "ins", B[j]); j++; }
  return {
    left: left, right: right,
    same: !left.some(x => x.kind !== "same") && !right.some(x => x.kind !== "same")
  };
}

function diffNode(parts) {
  const box = el("div", { class: "cmpfield" });
  if (!parts.length || parts.every(x => !clean(x.text))) {
    box.appendChild(el("span", { class: "small", text: "—" }));
    return box;
  }
  parts.forEach(pt => box.appendChild(
    pt.kind === "same" ? document.createTextNode(pt.text)
      : el(pt.kind === "del" ? "del" : "ins", { class: "d", text: pt.text })));
  return box;
}

const backToReview = uid => { S.stage = "review"; PENDING_SCROLL = "d-" + uid; renderAll(); };

/* Two reasons to open this view. A flagged near-duplicate is the loud one. The
   quiet one is every generated draft against the case it was derived from:
   "what did the tool take from TF-207, and what did it write itself?" is a
   question worth answering without reading both in two tabs. */
const comparableId = d => {
  const id = (d.similar && d.similar.tcid) || d.templateId || "";
  return S.archive.some(x => x.tcid === id) ? id : "";
};

function showCompare(d, wanted) {
  const id = wanted || comparableId(d);
  const c = S.archive.filter(x => x.tcid === id)[0];
  if (!c) { toast("That archived case is no longer in the knowledge base."); return; }
  const dup = !!(d.similar && d.similar.tcid === id);
  // the same figure the card already shows, so two adjacent screens agree:
  // the duplicate flag is raw cosine, a template match is the blended score
  const pct = dup ? d.similar.score
    : (d.templateId === id && d.templateScore ? d.templateScore : Math.round(cosine(
        tokenize(d.name + " " + d.description + " " + d.steps.map(x => x.action + " " + x.expected).join(" ")),
        tokenize(archiveText(c))) * 100));
  const p = $("#panel");
  p.textContent = "";

  p.appendChild(el("div", { class: "row" }, [
    el("button", { class: "btn sm", type: "button", onclick: () => backToReview(d.uid) }, "← Back to review"),
    el("button", { class: "btn sm", type: "button",
      onclick: () => { goto("archive"); showArchiveCase(c); } }, "Open the archived case"),
    el("span", { style: "margin-left:auto" }),
    dup ? el("button", { class: "btn sm", type: "button",
      title: "They are different enough — stop flagging this draft",
      onclick: () => { d.similar = null; save(); backToReview(d.uid); toast("Kept both."); } }, "Keep both") : null,
    dup ? el("button", { class: "btn ghost sm", type: "button",
      title: "The archived case already covers this — drop the draft",
      onclick: () => {
        pushUndo("dropping a duplicate draft");
        d.review = "rejected"; save(); backToReview(d.uid);
        toast("Draft dropped — " + c.tcid + " stands.");
      } }, "Drop the draft") : null
  ].filter(Boolean)));

  p.appendChild(head("Side by side", dup
    ? "The archived case on the left, your draft on the right, flagged as a near-duplicate at " + pct +
      "% alike. Red is only in the archive, green only in the draft. A row with no colour is a row the draft adds nothing to."
    : "The case this draft was derived from on the left, the draft on the right, " + pct +
      "% alike. Red is what the generator left behind, green what it wrote itself."));

  const grid = el("div", { class: "cmp" });
  grid.appendChild(el("div", { class: "cmphead" }, [
    document.createTextNode(c.tcid + " "), el("span", { class: "small", text: "knowledge base" })
  ]));
  grid.appendChild(el("div", { class: "cmphead" }, [
    document.createTextNode("This draft "), el("span", { class: "small", text: techName(d.technique, d.lang || "en") })
  ]));

  let differing = 0;
  const pair = (label, a, b) => {
    const big = String(a || "").length * String(b || "").length > DIFF_BUDGET;
    const dw = big ? null : diffWords(a, b);
    const same = big ? clean(a) === clean(b) : dw.same;
    if (!same) differing++;
    grid.appendChild(el("div", { class: "cmplabel" + (same ? "" : " differs"),
      text: label + (same ? "" : " — differs") }));
    grid.appendChild(dw ? diffNode(dw.left) : el("div", { class: "cmpfield", text: clean(a) || "—" }));
    grid.appendChild(dw ? diffNode(dw.right) : el("div", { class: "cmpfield", text: clean(b) || "—" }));
  };

  pair("Name", c.name, d.name);
  pair("Module", c.path || c.module, d.path || d.module);
  pair("Type", c.type, d.type);
  pair("Priority", c.priority, d.priority);
  pair("Precondition", c.precondition, d.precondition);
  const n = Math.max(c.steps.length, d.steps.length);
  for (let i = 0; i < n; i++) {
    const A = c.steps[i] || { action: "", expected: "" };
    const B = d.steps[i] || { action: "", expected: "" };
    pair("Step " + (i + 1) + " · action", A.action, B.action);
    pair("Step " + (i + 1) + " · expected", A.expected, B.expected);
  }
  p.appendChild(grid);
  p.appendChild(el("p", { class: "small", text: differing
    ? differing + (differing === 1 ? " field differs" : " fields differ") + " out of " + (5 + n * 2) +
      ". Steps are lined up by position, so one inserted step colours everything after it."
    : "Every field is identical. This draft adds nothing the archive does not already hold." }));
}

/* ------------------------------------------------------- stage: coverage */
/* The release view: where the coverage is thin, which criteria have nothing at
   all, and what it will cost to run. Everything here counts drafts that are not
   rejected — approving is a review decision, coverage is a planning question. */

const TECH_ORDER = ["ep", "epInvalid", "bva", "dt", "st", "uc"];
const TECH_SHORT = {
  en: { ep:"Positive", epInvalid:"Negative", bva:"Boundary", dt:"Decision", st:"State", uc:"End-to-end" },
  de: { ep:"Positiv", epInvalid:"Negativ", bva:"Grenzwert", dt:"Entscheidung", st:"Zustand", uc:"End-to-End" }
};
const techShort = k => (TECH_SHORT[genLangFor(null)] || TECH_SHORT.en)[k] || k;

const liveDrafts = () => S.drafts.filter(d => d.review !== "rejected");

/* Which criteria a draft answers — an end-to-end case answers all of them. */
function draftCovers(d, index) {
  if (d.acRef === "AC" + (index + 1)) return true;
  const span = String(d.acRef || "").match(/^AC1–AC(\d+)$/);
  return !!(span && index + 1 <= Number(span[1]));
}

function coverageRows() {
  const live = liveDrafts();
  const out = [];
  S.requirements.forEach(r => {
    const mine = live.filter(d => d.requirement === r.key);
    if (!r.ac.length) {
      out.push({ req: r, label: "—", text: r.summary, cases: mine });
      return;
    }
    r.ac.forEach((ac, i) => {
      out.push({ req: r, label: "AC" + (i + 1), text: ac.text, cases: mine.filter(d => draftCovers(d, i)) });
    });
  });
  return out;
}

/* Minutes out of whatever the project calls its duration field. */
function parseMinutes(v) {
  const s = String(v == null ? "" : v).toLowerCase().replace(",", ".");
  let m = s.match(/(\d+(?:\.\d+)?)\s*(h|std|hour|stunde)/);
  if (m) return Math.round(parseFloat(m[1]) * 60);
  m = s.match(/(\d+(?:\.\d+)?)\s*(min|minute)/);
  if (m) return Math.round(parseFloat(m[1]));
  m = s.match(/^\s*(\d+)\s*$/);
  return m ? Number(m[1]) : 0;
}
function humanMinutes(t) {
  const h = Math.floor(t / 60), m = t % 60;
  return (h ? h + " h " : "") + m + " min";
}
function effortEstimate() {
  let best = null;
  ((S.conventions && S.conventions.extra) || []).forEach(f => {
    const mins = S.archive.map(c => parseMinutes((c.extra || {})[f.name])).filter(x => x > 0);
    if (mins.length >= 3 && (!best || mins.length > best.mins.length)) best = { name: f.name, mins: mins };
  });
  if (!best) return null;
  const avg = best.mins.reduce((a, b) => a + b, 0) / best.mins.length;
  const n = liveDrafts().length;
  return { field: best.name, sample: best.mins.length, avg: Math.round(avg), cases: n, total: Math.round(avg * n) };
}

function viewCoverage(p) {
  p.appendChild(head("Coverage",
    "What this release covers and what it does not, before any of it reaches qTest. Counts include every draft you have not dropped."));

  if (!S.requirements.length) {
    p.appendChild(el("div", { class: "empty", text: "Import the requirements for this release to see its coverage." }));
    return;
  }

  const rows = coverageRows();
  const gaps = rows.filter(x => !x.cases.length);
  const byReq = {};
  rows.forEach(x => {
    const k = x.req.key;
    byReq[k] = byReq[k] || { req: x.req, total: 0, covered: 0 };
    byReq[k].total++;
    if (x.cases.length) byReq[k].covered++;
  });
  const reqs = Object.keys(byReq).map(k => byReq[k]);
  const full = reqs.filter(x => x.covered === x.total).length;
  const none = reqs.filter(x => !x.covered).length;
  const part = reqs.length - full - none;
  const eff = effortEstimate();

  /* headline tiles — the four numbers a release meeting asks for */
  const tiles = el("div", { class: "kpis" });
  const jump = id => () => { const t = document.getElementById(id); if (t) t.scrollIntoView({ behavior: "smooth", block: "start" }); };
  tiles.appendChild(kpiTile("Fully covered", String(full), "of " + reqs.length + " requirements",
    full === reqs.length ? "is-good" : "", undefined, jump("cov-byreq")));
  tiles.appendChild(kpiTile("Partly covered", String(part), part ? "criteria still open" : "none",
    part ? "is-warn" : "", undefined, part ? jump("cov-byreq") : null));
  tiles.appendChild(kpiTile("No coverage", String(none), none ? "nothing written yet" : "none",
    none ? "is-crit" : "is-good", undefined, none ? jump("cov-gaps") : null));
  tiles.appendChild(kpiTile("Run time", eff ? humanMinutes(eff.total) : "—",
    eff ? liveDrafts().length + " cases × ø " + eff.avg + " min" : "no duration field in the archive"));
  p.appendChild(tiles);

  /* the matrix: module against technique, the hue carrying the count */
  const counts = new Map();
  liveDrafts().forEach(d => {
    const k = d.module || "(no module)";
    if (!counts.has(k)) counts.set(k, {});
    const row = counts.get(k);
    row[d.technique] = (row[d.technique] || 0) + 1;
  });
  const modules = Array.from(counts.keys())
    .map(k => ({ name: k, row: counts.get(k), total: TECH_ORDER.reduce((n, t) => n + (counts.get(k)[t] || 0), 0) }))
    .sort((a, b) => b.total - a.total);
  const peak = Math.max.apply(null, [1].concat(modules.map(m =>
    Math.max.apply(null, [0].concat(TECH_ORDER.map(t => m.row[t] || 0))))));

  const matrixCard = el("div", { class: "card" }, [
    el("h3", { text: "Where the coverage sits" }),
    el("p", { class: "card-sub", text: "Cases per module and test design technique. A pale column across every module is a technique this release is not using." })
  ]);
  if (!modules.length) matrixCard.appendChild(el("p", { class: "small", text: "No drafts yet." }));
  else {
    const tw = el("div", { class: "tablewrap", style: "padding:8px" });
    const t = el("table", { class: "matrix" });
    t.appendChild(el("thead", {}, el("tr", {}, [el("th", { class: "rowhead", text: "Module" })]
      .concat(TECH_ORDER.map(k => el("th", { text: techShort(k) })))
      .concat([el("th", { text: "All" })]))));
    const tb = el("tbody");
    modules.forEach(m => {
      const tr = el("tr", {}, [el("th", { class: "rowhead", text: m.name, title: m.name })]);
      TECH_ORDER.forEach(k => {
        const n = m.row[k] || 0;
        const step = n === 0 ? 0 : Math.max(1, Math.ceil(n / peak * 5));
        const label = m.name + " · " + techName(k, genLangFor(null)) + ": " + n + (n === 1 ? " case" : " cases");
        tr.appendChild(el("td", {
          class: n ? "" : "z",
          style: "background:var(--heat-" + step + ");color:var(--heat-" + step + "-ink)"
        }, n
          ? el("button", { type: "button", title: label + " — open them", onclick: () => goto("review", { draftModule: m.name, draftTech: k }) }, String(n))
          : el("span", { title: label, text: "–" })));
      });
      tr.appendChild(el("td", { class: "tot", text: String(m.total) }));
      tb.appendChild(tr);
    });
    t.appendChild(tb); tw.appendChild(t); matrixCard.appendChild(tw);
  }

  /* technique mix — one measure across categories, so one hue and no legend */
  const mix = {};
  liveDrafts().forEach(d => { mix[d.technique] = (mix[d.technique] || 0) + 1; });
  const mixMax = Math.max.apply(null, [1].concat(TECH_ORDER.map(k => mix[k] || 0)));
  const mixCard = el("div", { class: "card" }, [
    el("h3", { text: "Technique mix" }),
    el("p", { class: "card-sub", text: "A release that is only positive cases is a release that only proves the happy path." }),
    el("div", { class: "bars" }, TECH_ORDER.map(k => {
      const n = mix[k] || 0;
      const kids = [
        el("span", { text: techShort(k), title: techName(k, genLangFor(null)) }),
        el("span", { class: "bartrack" }, el("i", { style: "width:" + Math.round(n / mixMax * 100) + "%" })),
        el("span", { class: "barval", text: String(n) })
      ];
      return n
        ? el("button", { class: "barrow", type: "button", title: "Open the " + techName(k, genLangFor(null)) + " drafts",
                         onclick: () => goto("review", { draftTech: k }) }, kids)
        : el("div", { class: "barrow" }, kids);
    }))
  ]);

  // the matrix is the point of this page, so it gets the full width
  p.appendChild(matrixCard);

  /* the actionable half: what has nothing */
  const gapCard = el("div", { class: "card", id: "cov-gaps" }, [el("h3", { text: "Gaps" })]);
  if (!gaps.length) {
    gapCard.appendChild(el("div", { class: "note", text: "Every acceptance criterion in this release has at least one test case." }));
  } else {
    gapCard.appendChild(el("p", { class: "card-sub", text: gaps.length + " acceptance criteria have no test case. Each one is a hole a release goes live with." }));
    gapCard.appendChild(el("div", { class: "stack" }, gaps.slice(0, 40).map(g => el("button", {
      class: "gaprow", type: "button", title: "Open " + g.req.key,
      onclick: () => goto("requirements", null, "req-" + g.req.key)
    }, [
      el("span", { class: "mono", text: g.req.key + " " + g.label }),
      el("span", { text: g.text })
    ]))));
    if (gaps.length > 40) gapCard.appendChild(el("p", { class: "small", style: "margin-top:8px", text: "…and " + (gaps.length - 40) + " more." }));
  }
  p.appendChild(el("div", { class: "split" }, [gapCard, mixCard]));

  /* Traceability: requirement down to criterion down to the case that answers
     it. The same three columns the export writes, but open on the page and
     with the two ways of closing a hole attached to the hole itself. */
  const byKey = {};
  rows.forEach(x => { (byKey[x.req.key] = byKey[x.req.key] || []).push(x); });
  const autoOpen = reqs.length <= 12;
  const traceCard = el("div", { class: "card", id: "cov-byreq" }, [
    el("div", { class: "row" }, [
      el("h3", { text: "Traceability", style: "margin:0" }),
      el("span", { style: "margin-left:auto" }),
      el("button", { class: "btn sm", type: "button", title: "Open or close every requirement",
        onclick: e => {
          const all = Array.prototype.slice.call(traceCard.querySelectorAll("details.tracereq"));
          const opening = all.some(x => !x.open);
          all.forEach(x => { x.open = opening; });
          e.currentTarget.textContent = opening ? "Collapse all" : "Expand all";
        } }, (autoOpen && reqs.some(x => x.covered < x.total)) ? "Collapse all" : "Expand all"),
      el("button", { class: "btn sm", type: "button", title: "The same matrix as a file",
        onclick: () => goto("export") }, "Export the matrix"),
      el("button", { class: "btn sm", type: "button", onclick: () => { try { window.print(); } catch (e) { toast("Printing is blocked here — open the file from disk to print."); } } }, "Print this page")
    ]),
    el("p", { class: "card-sub", style: "margin-top:8px", text:
      "Every requirement, every acceptance criterion under it, and the case that answers it. A criterion with nothing under it carries the two ways of closing it." })
  ]);
  reqs.forEach(x => traceCard.appendChild(traceBlock(x, byKey[x.req.key] || [], autoOpen)));
  p.appendChild(traceCard);

  if (eff) {
    p.appendChild(el("p", { class: "small", text:
      "Run time is read from your archive's “" + eff.field + "” field across " + eff.sample +
      " cases (average " + eff.avg + " min) and multiplied by the " + eff.cases +
      " drafts in this release. It is an order of magnitude, not a plan." }));
  }
}

/* One requirement, opened out into its criteria and the cases beneath them. */
function traceBlock(x, acRows, autoOpen) {
  const req = x.req;
  const mine = liveDrafts().filter(d => d.requirement === req.key);
  const pct = x.total ? Math.round(x.covered / x.total * 100) : 0;
  const cls = x.covered === x.total ? "good" : x.covered ? "warn" : "crit";

  const box = el("details", { class: "tracereq", open: (autoOpen && x.covered < x.total) ? "" : null });
  box.appendChild(el("summary", {}, [
    el("span", { class: "tw" }),
    el("span", { class: "key", text: req.key }),
    el("span", { class: "sum", text: req.summary, title: req.summary }),
    el("span", { class: "bar", title: pct + "% of its criteria are covered" }, el("i", { style: "width:" + pct + "%" })),
    el("span", { class: "chip " + cls,
      text: x.covered === x.total ? "all " + x.total + " covered" : x.covered + " of " + x.total }),
    el("span", { class: "small", text: mine.length + (mine.length === 1 ? " case" : " cases") }),
    // the technique mix, worth seeing while the fold is shut and noise once it is open
    el("span", { class: "techs" }, uniq(mine.map(d => d.technique))
      .map(k => el("span", { class: "chip", text: techShort(k), title: techName(k, genLangFor(null)) })))
  ]));

  const list = el("div", { class: "acrows" });
  acRows.forEach(r => {
    const acts = el("div", { class: "acacts" });
    if (r.cases.length) {
      r.cases.forEach(d => {
        const h = healthOf(d, true);
        acts.appendChild(el("button", {
          class: "chip " + (h.band.cls || "good"), type: "button", style: "cursor:pointer",
          title: d.name + "\n\n" + healthTooltip(h) + "\n\nOpen it in Review",
          onclick: () => goto("review", { draftReq: req.key }, "d-" + d.uid)
        }, "✓ " + d.name));
      });
    } else {
      acts.appendChild(el("span", { class: "chip crit", text: "no test case" }));
      acts.appendChild(el("button", {
        class: "btn sm", type: "button", title: "Forge the cases for " + req.key + " from the knowledge base",
        onclick: () => { runGeneration(req.key); goto("review", { draftReq: req.key }); }
      }, "Generate"));
      acts.appendChild(el("button", {
        class: "btn sm", type: "button", title: "Pin an existing archived case to this criterion",
        onclick: () => showAcLinkPicker(req, r.label)
      }, "Link existing"));
    }
    list.appendChild(el("div", { class: "acrow " + (r.cases.length ? "" : "gap") }, [
      el("span", { class: "acn", text: r.label }),
      el("div", { class: "acbody" }, [el("span", { text: r.text }), acts])
    ]));
  });
  box.appendChild(list);
  return box;
}

/* Some criteria are already proved by a case sitting in the archive. This pins
   that case to the criterion instead of forging a near-copy beside it. */
function showAcLinkPicker(req, acLabel) {
  const p = $("#panel");
  p.textContent = "";
  p.appendChild(el("div", { class: "row" }, [
    el("button", { class: "btn sm", type: "button", onclick: () => goto("coverage", null, "cov-byreq") }, "← Back to coverage")
  ]));
  const card = el("div", { class: "reqcard" }, [
    el("header", {}, [
      el("span", { class: "key", text: req.key + (acLabel === "—" ? "" : " · " + acLabel) }),
      el("span", { class: "sum", text: req.summary })
    ])
  ]);
  const body = el("div", { class: "body" });
  const m = /^AC(\d+)$/.exec(acLabel);
  const idx = m ? Number(m[1]) - 1 : -1;
  if (idx >= 0 && req.ac[idx]) body.appendChild(el("div", { class: "note", text: req.ac[idx].text }));

  const matches = matchesFor(req, 12);
  if (!S.archive.length) {
    body.appendChild(el("div", { class: "empty", text: "There is no knowledge base to link from yet." }));
  } else if (!matches.length) {
    body.appendChild(el("div", { class: "empty", text: "Nothing archived comes close to this requirement. Forge a new case instead." }));
  } else {
    body.appendChild(el("p", { class: "card-sub", text:
      "The closest archived cases. Pick the one that already proves this criterion — it is carried into Review whole, steps and all, with the criterion attached." }));
    body.appendChild(el("div", { class: "stack" }, matches.map(x => el("div", { class: "matchrow" }, [
      el("span", { class: "mono small", text: x.tc.tcid }),
      el("span", { class: "nm", text: x.tc.name }),
      healthChip(healthOf(x.tc)),
      el("span", { class: "bar", title: "How close it is to the requirement" }, el("i", { style: "width:" + Math.round(x.score * 100) + "%" })),
      el("span", { class: "score", text: Math.round(x.score * 100) + "%" }),
      el("button", { class: "btn sm", type: "button", onclick: () => linkArchiveCase(x.tc, req, acLabel) }, "Link this case")
    ]))));
  }
  card.appendChild(body);
  p.appendChild(card);
}

function linkArchiveCase(c, req, acLabel) {
  pushUndo("linking an archived case");
  const d = draftFromArchiveCase(c);
  d.requirement = req.key;
  d.acRef = acLabel === "—" ? "" : acLabel;
  d.origin = "linked";
  S.drafts.push(d);
  flagDuplicates();
  save();
  goto("review", { draftReq: req.key }, "d-" + d.uid);
  toast(c.tcid + " linked to " + req.key + (d.acRef ? " " + d.acRef : "") + ".");
}

/* ------------------------------------------------ overlays and shortcuts */

    html: "<strong>Precondition</strong><br>" + escapeHtml(c.precondition).replace(/\n/g, "<br>") }));

  body.appendChild(el("details", { class: "raw", open: h.score < 85 ? "" : null }, [
    el("summary", { text: "Test health — " + h.score + " / 100 · " + h.band.label }),
    healthList(h.checks)
  ]));

  const tw = el("div", { class: "tablewrap" });

  document.body.appendChild(scrim);
  document.body.appendChild(box);
  const first = box.querySelector("header button");
  if (first) first.focus();
}

/* ---- Ctrl+K ------------------------------------------------------------- */
/* Rebuilt whenever the counts move, not on every keystroke: a knowledge base
   of several thousand cases would otherwise be re-lowercased as you type. */
let SEARCH_INDEX = null, SEARCH_STAMP = "";
function searchIndex() {
  const stamp = S.archive.length + "/" + S.history.length + "/" + S.requirements.length + "/" + S.drafts.length;
  if (SEARCH_INDEX && SEARCH_STAMP === stamp) return SEARCH_INDEX;
  const rows = [];
  STAGES.forEach(st => rows.push({
    kind: "Go to", key: String(STAGES.indexOf(st) + 1), name: st.label, meta: "stage",
    hay: st.label.toLowerCase(), open: () => goto(st.id)
  }));
  S.archive.forEach(c => rows.push({
    kind: "Knowledge base", key: c.tcid, name: c.name, meta: c.path || c.module || "",
    hay: (c.tcid + " " + c.name + " " + (c.path || "") + " " + c.module + " " + c.tags + " " +
          c.requirement + " " + c.steps.map(x => x.action).join(" ")).toLowerCase(),
    open: () => { goto("archive"); showArchiveCase(c); }
  }));
  S.requirements.forEach(r => rows.push({
    kind: "This release", key: r.key, name: r.summary, meta: r.ac.length + " AC",
    hay: (r.key + " " + r.summary + " " + r.ac.map(a => a.text).join(" ")).toLowerCase(),
    open: () => goto("requirements", null, "req-" + r.key)
  }));
  S.history.forEach(r => rows.push({
    kind: "Past requirements", key: r.key, name: r.summary, meta: linkedCases(r).length + " cases",
    hay: (r.key + " " + r.summary).toLowerCase(),
    open: () => goto("archive", null, "h-" + r.key)
  }));
  S.drafts.forEach(d => rows.push({
    kind: "Drafts", key: d.requirement || "—", name: d.name,
    meta: techShort(d.technique) + (d.review === "approved" ? " · approved" : ""),
    hay: (d.name + " " + d.requirement + " " + d.technique + " " + d.module).toLowerCase(),
    open: () => { S.stage = "review"; PENDING_SCROLL = "d-" + d.uid; renderAll(); }
  }));
  SEARCH_INDEX = rows; SEARCH_STAMP = stamp;
  return rows;
}

const SEARCH_ORDER = ["Go to", "This release", "Knowledge base", "Drafts", "Past requirements"];

function searchHits(q) {
  const t = clean(q).toLowerCase();
  if (!t) return [];
  const terms = t.split(" ").filter(Boolean);
  const byKind = {};
  searchIndex().forEach(r => {
    if (!terms.every(w => r.hay.indexOf(w) >= 0)) return;
    const head = (r.key + " " + r.name).toLowerCase();
    (byKind[r.kind] = byKind[r.kind] || []).push({
      r: r, rank: terms.every(w => head.indexOf(w) >= 0) ? 0 : 1
    });
  });
  // The kinds come in a fixed order so the list never reshuffles under you, and
  // each is capped so one huge knowledge base cannot crowd the others out.
  const keep = [];
  SEARCH_ORDER.forEach(kind => {
    (byKind[kind] || []).sort((a, b) => a.rank - b.rank)
      .slice(0, 6).forEach(x => keep.push(x.r));
  });
  return keep.slice(0, 30);
}

function openPalette() {
  closeOverlays();
  const scrim = el("div", { class: "scrim", onclick: e => { if (e.target === scrim) closeOverlays(); } });
  const box = el("div", { class: "palette", role: "dialog", "aria-label": "Search everything" });
  const input = el("input", { type: "text", id: "palette-q", autocomplete: "off",
    placeholder: "Search test cases, requirements, drafts — or a stage by name…" });
  const hits = el("div", { class: "phits", id: "palette-hits" });
  let list = [], at = 0;

  const paint = () => {
    hits.textContent = "";
    if (!list.length) {
      hits.appendChild(el("p", { class: "small", style: "padding:14px",
        text: clean(input.value) ? "Nothing matches that." : "Type to search everything the project holds." }));
      return;
    }
    let kind = "";
    list.forEach((r, i) => {
      if (r.kind !== kind) { kind = r.kind; hits.appendChild(el("div", { class: "pgroup", text: kind })); }
      hits.appendChild(el("button", {
        class: "phit", type: "button", "aria-selected": i === at ? "true" : "false",
        onmousemove: () => { if (at !== i) { at = i; paint(); } },
        onclick: () => { closeOverlays(); r.open(); }
      }, [
        el("span", { class: "pk", text: r.key }),
        el("span", { class: "pn", text: r.name, title: r.name }),
        r.meta ? el("span", { class: "pm", text: r.meta }) : null
      ].filter(Boolean)));
    });
    const sel = hits.querySelector('[aria-selected="true"]');
    if (sel) sel.scrollIntoView({ block: "nearest" });
  };

  input.addEventListener("input", () => { list = searchHits(input.value); at = 0; paint(); });
  input.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { e.preventDefault(); at = Math.min(at + 1, list.length - 1); paint(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); at = Math.max(at - 1, 0); paint(); }
    else if (e.key === "Enter" && list[at]) { e.preventDefault(); closeOverlays(); list[at].open(); }
  });

  box.appendChild(input);
  box.appendChild(hits);
  box.appendChild(el("div", { class: "pfoot" }, [
    el("span", {}, [el("kbd", { text: "↑↓" }), document.createTextNode(" move")]),
    el("span", {}, [el("kbd", { text: "↵" }), document.createTextNode(" open")]),
    el("span", {}, [el("kbd", { text: "Esc" }), document.createTextNode(" close")]),
    el("span", { style: "margin-left:auto", text: searchIndex().length + " things indexed" })
  ]));
  scrim.appendChild(box);
  document.body.appendChild(scrim);
  paint();
  input.focus();
}

    if (stray.length) {
      p.appendChild(el("div", { class: "note warn" }, [
        el("p", { html: "<strong>" + (stray.length === 1 ? "One path is" : stray.length + " paths are") + " not in your module tree.</strong> qTest creates a new module for each one instead of filing those cases where you expect them. Fix the path on the draft, or read the tree again if it has grown:" }),
        el("div", { class: "stack", style: "margin-top:8px" }, stray.map(x => el("span", { class: "mono small", text: x })))
      ]));
    }
  }
  if (wantQTest) {
    p.appendChild(exportBlock("qTest test cases", "qtest-testcases.csv", toCsv(qtRows, S.exp.delimiter, S.exp.bom)));
    p.appendChild(exportBlock("Traceability matrix", "traceability-matrix.csv", toCsv(buildTraceRows(), S.exp.delimiter, S.exp.bom)));
  }
  if (wantTosca) {
    p.appendChild(el("div", { class: "note warn", html:
      "<strong>Provisional column layout.</strong><br>" +
      "The reading of the steps below — module, control, ActionMode, value — is the useful part and is already worked out. " +
      "The column names are a best guess at your Tosca import until I see one of your own Tosca exports; send one and this sheet " +
      "changes to match it. Until then, treat it as a specification to hand the automation engineer rather than a file to import blind." }));
    p.appendChild(exportBlock("Tosca automation spec", "tosca-teststeps.csv", toCsv(tosRows, S.exp.delimiter, S.exp.bom)));
  }
}

function exportBlock(title, filename, text) {
  const card = el("div", { class: "card" }, [
    el("div", { class: "row" }, [
      el("h3", { text: title, style: "margin:0" }),
      el("span", { class: "small mono", text: filename }),
      el("span", { style: "margin-left:auto" }),
      el("button", { class: "btn primary sm", type: "button", onclick: () => copyText(text) }, "Copy"),
      el("button", { class: "btn sm", type: "button", onclick: () => trySave(filename, text) }, "Save file")
    ])
  ]);
  card.appendChild(el("pre", { class: "pre", style: "margin-top:12px", text: text.replace(/^﻿/, "") }));
  return card;
}

/* A collapsed requirement would print as a bare heading, so paper gets all
   of them open and the screen gets them back the way they were. */
let PRINT_REOPENED = [];
window.addEventListener("beforeprint", () => {
  PRINT_REOPENED = Array.prototype.slice.call(document.querySelectorAll("details.tracereq"))
    .filter(x => !x.open);
  PRINT_REOPENED.forEach(x => { x.open = true; });
});
window.addEventListener("afterprint", () => {
  PRINT_REOPENED.forEach(x => { x.open = false; });
  PRINT_REOPENED = [];
});

/* ---------------------------------------------------------------- boot */
/* Keys are global, but a letter typed into a step is a letter, not a command. */
const TYPING = () => {
  const a = document.activeElement;
  return !!a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT" || a.isContentEditable);
};
function toggleFold(d) {
  if (OPEN_DRAFTS.has(d.uid)) OPEN_DRAFTS.delete(d.uid); else OPEN_DRAFTS.add(d.uid);
  refreshDraft(d);
}

document.addEventListener("keydown", e => {
  const meta = e.ctrlKey || e.metaKey;

  if (meta && e.key.toLowerCase() === "k") { e.preventDefault(); openPalette(); return; }
  if (meta && e.key.toLowerCase() === "s") { e.preventDefault(); $("#btn-save").click(); return; }
  if (e.key === "Escape") {
    if (closeOverlays()) return;
    if (CURSOR) { CURSOR = ""; paintCursor(); }
    return;
  }
  if (meta || e.altKey || TYPING() || document.querySelector(".scrim, .drawer")) return;

  if (e.key === "/") { e.preventDefault(); const f = $("#dr-search") || $("#arc-search"); if (f) f.focus(); return; }
  if (S.stage !== "review") return;

  const k = e.key.toLowerCase();
  if (k === "j" || e.key === "ArrowDown") { e.preventDefault(); moveCursor(1); return; }
  if (k === "k" || e.key === "ArrowUp")   { e.preventDefault(); moveCursor(-1); return; }

  const d = cursorDraft();
  if (!d) return;
  if (k === "a") {
    e.preventDefault();
    d.review = d.review === "approved" ? "draft" : "approved";
    save(); refreshDraft(d);
  } else if (k === "x") {
    e.preventDefault();
    d.review = d.review === "rejected" ? "draft" : "rejected";
    save(); refreshDraft(d);
  } else if (k === "o" || e.key === "Enter") {
    e.preventDefault();
    if (S.review.compact) toggleFold(d);
    else document.getElementById("d-" + d.uid).scrollIntoView({ block: "center", behavior: "smooth" });
  } else if (e.key === " ") {
    e.preventDefault();
    if (PICKED.has(d.uid)) PICKED.delete(d.uid); else PICKED.add(d.uid);
    refreshDraft(d);
  }
});

});
