<title>Kronicore Testfall-Schmiede</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#eef1f0; --surface:#ffffff; --surface-2:#e4e9e8; --surface-3:#f6f8f7;
  --line:#ccd5d3; --line-soft:#dde4e2;
  --text:#121d1c; --muted:#5b6b68; --faint:#869592;
  --accent:#0d6b62; --accent-ink:#ffffff; --accent-soft:#d7ecea; --accent-line:#8fc9c2;
  --good:#2f7a3d; --good-soft:#dcefdd;
  --warn:#8a6100; --warn-soft:#f7ead1;
  --crit:#a5261d; --crit-soft:#f8dedb;
  --heat-0:transparent;   --heat-0-ink:var(--faint);
  --heat-1:#d7ecea;       --heat-1-ink:#14201f;
  --heat-2:#a8d8d2;       --heat-2-ink:#14201f;
  --heat-3:#6dbdb3;       --heat-3-ink:#14201f;
  --heat-4:#2a9287;       --heat-4-ink:#ffffff;
  --heat-5:#0d6b62;       --heat-5-ink:#ffffff;
  --shadow:0 1px 2px rgba(18,29,28,.06), 0 8px 24px -16px rgba(18,29,28,.35);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --heat-0:transparent;   --heat-0-ink:var(--faint);
    --heat-1:#12302d;       --heat-1-ink:#e3ebe9;
    --heat-2:#1c4a45;       --heat-2-ink:#e3ebe9;
    --heat-3:#2a6b63;       --heat-3-ink:#e3ebe9;
    --heat-4:#3a9d92;       --heat-4-ink:#06211e;
    --heat-5:#4ecdbd;       --heat-5-ink:#06211e;
    --bg:#0c1211; --surface:#141c1b; --surface-2:#1b2524; --surface-3:#101817;
    --line:#2a3634; --line-soft:#222d2c;
    --text:#e3ebe9; --muted:#95a7a3; --faint:#71827f;
    --accent:#4ecdbd; --accent-ink:#06211e; --accent-soft:#12302d; --accent-line:#2a5b55;
    --good:#61bd6f; --good-soft:#15291a;
    --warn:#dfa63f; --warn-soft:#2c2412;
    --crit:#ef7a70; --crit-soft:#31191a;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --heat-0:transparent;   --heat-0-ink:var(--faint);
  --heat-1:#12302d;       --heat-1-ink:#e3ebe9;
  --heat-2:#1c4a45;       --heat-2-ink:#e3ebe9;
  --heat-3:#2a6b63;       --heat-3-ink:#e3ebe9;
  --heat-4:#3a9d92;       --heat-4-ink:#06211e;
  --heat-5:#4ecdbd;       --heat-5-ink:#06211e;
  --bg:#0c1211; --surface:#141c1b; --surface-2:#1b2524; --surface-3:#101817;
  --line:#2a3634; --line-soft:#222d2c;
  --text:#e3ebe9; --muted:#95a7a3; --faint:#71827f;
  --accent:#4ecdbd; --accent-ink:#06211e; --accent-soft:#12302d; --accent-line:#2a5b55;
  --good:#61bd6f; --good-soft:#15291a;
  --warn:#dfa63f; --warn-soft:#2c2412;
  --crit:#ef7a70; --crit-soft:#31191a;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; text-wrap:balance; font-weight:600; letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

.wrap{max-width:1280px; margin:0 auto; padding-inline:16px; padding-block:0 56px}

/* ---------- masthead ---------- */
.masthead{
  display:flex; flex-wrap:wrap; align-items:flex-end; gap:16px 24px;
  padding-block:24px 18px; border-bottom:1px solid var(--line);
}
.brand{display:flex; flex-direction:column; gap:3px; min-width:0}
.brand .eyebrow{
  font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent);
}
.brand h1{font-size:25px; line-height:1.15}
.brand .sub{color:var(--muted); font-size:13.5px; max-width:58ch}
.masthead-actions{display:flex; gap:8px; margin-left:auto; flex-wrap:wrap}

/* ---------- kpi strip ---------- */
.kpis{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:1px; background:var(--surface); border:1px solid var(--line);
  border-radius:8px; overflow:hidden; margin-block:18px;
}
.kpi{background:var(--surface); padding:12px 14px; display:flex; flex-direction:column; gap:2px;
  box-shadow:0 0 0 1px var(--line-soft)}
button.kpi{text-align:left; border:0; font:inherit; color:inherit; cursor:pointer; width:100%}
button.kpi:hover{background:var(--surface-3)}
button.kpi:hover .v{text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px}
.kpi .k{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint)}
.kpi .v{font-family:var(--mono); font-size:26px; font-weight:600; line-height:1.1; font-variant-numeric:tabular-nums}
.kpi .n{font-size:12px; color:var(--muted)}
.kpi.is-good .v{color:var(--good)} .kpi.is-warn .v{color:var(--warn)} .kpi.is-crit .v{color:var(--crit)}
.meter{height:4px; border-radius:2px; background:var(--surface-2); overflow:hidden; margin-top:6px}
.meter>i{display:block; height:100%; background:var(--accent)}

/* ---------- layout ---------- */
.shell{display:grid; grid-template-columns:232px minmax(0,1fr); gap:24px; align-items:start}
@media (max-width:860px){ .shell{grid-template-columns:minmax(0,1fr)} }

.rail{position:sticky; top:calc(env(safe-area-inset-top,0px) + 8px); display:flex; flex-direction:column; gap:2px}
@media (max-width:860px){
  .rail{position:static; flex-direction:row; overflow-x:auto; gap:6px; padding-bottom:6px; scrollbar-width:thin}
}
.stage{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:9px 11px; border:1px solid transparent; border-radius:7px;
  background:transparent; cursor:pointer; color:var(--muted); white-space:nowrap;
}
.stage:hover{background:var(--surface-2); color:var(--text)}
.stage[aria-current="true"]{background:var(--surface); border-color:var(--line); color:var(--text); box-shadow:var(--shadow)}
.stage .num{
  font-family:var(--mono); font-size:11px; width:20px; height:20px; flex:none;
  display:grid; place-items:center; border-radius:5px; background:var(--surface-2); color:var(--faint);
}
.stage[aria-current="true"] .num{background:var(--accent); color:var(--accent-ink)}
.stage .lbl{font-size:13.5px; font-weight:500; flex:1; min-width:0}
.stage .cnt{font-family:var(--mono); font-size:11px; color:var(--faint); font-variant-numeric:tabular-nums}

/* ---------- panels ---------- */
.panel{display:flex; flex-direction:column; gap:16px; min-width:0}
.panel-head{display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 14px}
.panel-head h2{font-size:19px}
.panel-head .hint{color:var(--muted); font-size:13px; flex:1 1 280px; min-width:0}

.card{background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:16px}
.card.tight{padding:12px}
.card>h3{font-size:14px; margin-bottom:10px}
.card-sub{color:var(--muted); font-size:12.5px; margin-top:-6px; margin-bottom:10px}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px}

label.field{display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--muted)}
label.field>span{font-weight:500}
input[type=text],input[type=number],select,textarea{
  width:100%; padding:7px 9px; background:var(--surface-3); border:1px solid var(--line);
  border-radius:6px; font-size:13.5px;
}
textarea{font-family:var(--mono); font-size:12.5px; line-height:1.55; resize:vertical; min-height:120px}
input[type=file]{font-size:12.5px; color:var(--muted); max-width:100%}

.btn{
  display:inline-flex; align-items:center; gap:6px; padding:7px 13px; border-radius:6px;
  border:1px solid var(--line); background:var(--surface); color:var(--text);
  font-size:13px; font-weight:500; cursor:pointer;
}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px; font-size:12px}
.btn.ghost{background:transparent; border-color:transparent; color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2); color:var(--text)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.row.end{justify-content:flex-end}

.chip{
  display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:20px;
  font-size:11.5px; font-weight:500; background:var(--surface-2); color:var(--muted);
  border:1px solid var(--line-soft); white-space:nowrap;
}
.chip.mono{font-family:var(--mono); font-size:11px}
.chip.accent{background:var(--accent-soft); color:var(--accent); border-color:var(--accent-line)}
.chip.good{background:var(--good-soft); color:var(--good); border-color:transparent}
.chip.warn{background:var(--warn-soft); color:var(--warn); border-color:transparent}
.chip.crit{background:var(--crit-soft); color:var(--crit); border-color:transparent}
.chip button{background:none; border:0; padding:0; cursor:pointer; color:inherit; opacity:.6; font-size:13px; line-height:1}
.chip button:hover{opacity:1}

.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:8px; background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:13px}
th,td{text-align:left; padding:8px 11px; border-bottom:1px solid var(--line-soft); vertical-align:top}
th{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--faint); font-weight:500; background:var(--surface-3); position:sticky; top:0;
}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-3)}
td.id{font-family:var(--mono); font-size:11.5px; color:var(--muted); white-space:nowrap}
td.num{font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}

.empty{
  border:1px dashed var(--line); border-radius:9px; padding:26px 18px; text-align:center;
  color:var(--muted); font-size:13.5px; background:var(--surface-3);
}
.note{
  border-left:3px solid var(--accent); background:var(--accent-soft); color:var(--text);
  padding:10px 13px; border-radius:0 7px 7px 0; font-size:13px;
}
.note.warn{border-left-color:var(--warn); background:var(--warn-soft)}
.note strong{font-weight:600}

/* ---------- requirement / draft cards ---------- */
.reqcard{background:var(--surface); border:1px solid var(--line); border-radius:9px; overflow:hidden}
.reqcard>header{
  display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center;
  padding:11px 14px; border-bottom:1px solid var(--line-soft); background:var(--surface-3);
}
.reqcard>header .key{font-family:var(--mono); font-size:12.5px; font-weight:600; color:var(--accent)}
.reqcard>header .sum{font-weight:600; font-size:14px; flex:1 1 260px; min-width:0}
.reqcard .body{padding:13px 14px; display:flex; flex-direction:column; gap:11px}
.aclist{display:flex; flex-direction:column; gap:6px; margin:0; padding:0; list-style:none}
.aclist li{
  display:flex; gap:9px; align-items:flex-start; font-size:13px;
  padding:7px 10px; background:var(--surface-3); border-radius:6px; border:1px solid var(--line-soft);
}
.aclist .acn{font-family:var(--mono); font-size:10.5px; color:var(--faint); padding-top:2px; flex:none}
.matchrow{
  display:flex; flex-wrap:wrap; gap:8px 10px; align-items:center;
  padding:7px 10px; border:1px solid var(--line-soft); border-radius:6px; font-size:12.5px;
}
.matchrow.top{border-color:var(--accent-line); background:var(--accent-soft)}
.matchrow .nm{flex:1 1 200px; min-width:0}
.score{font-family:var(--mono); font-size:11.5px; font-variant-numeric:tabular-nums; color:var(--muted)}
.bar{width:54px; height:5px; border-radius:3px; background:var(--surface-2); overflow:hidden; flex:none}
.bar>i{display:block; height:100%; background:var(--accent)}

.draft{background:var(--surface); border:1px solid var(--line); border-radius:9px; overflow:hidden}
.draft.approved{border-color:var(--good)}
.draft.rejected{opacity:.55}
.draft>header{display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 13px; border-bottom:1px solid var(--line-soft)}
.draft>header .grip{font-family:var(--mono); font-size:11px; color:var(--faint); flex:none}
.draft .title-in{flex:1 1 280px; min-width:0; font-weight:600; font-size:13.5px; background:transparent; border-color:transparent}
.draft .title-in:hover,.draft .title-in:focus{background:var(--surface-3); border-color:var(--line)}
.draft .body{padding:12px 13px; display:flex; flex-direction:column; gap:11px}
.metagrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:9px}
.steps{width:100%; font-size:12.5px}
.steps th:first-child,.steps td:first-child{width:34px; text-align:center}
.steps td{padding:5px 7px}
.steps textarea{min-height:44px; font-size:12.5px; font-family:var(--sans); background:var(--surface-3)}

.pre{
  font-family:var(--mono); font-size:11.5px; line-height:1.6; white-space:pre;
  background:var(--surface-3); border:1px solid var(--line); border-radius:8px;
  padding:12px; overflow:auto; max-height:380px; margin:0;
}
.toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  background:var(--text); color:var(--bg); padding:9px 16px; border-radius:20px; font-size:13px;
  font-weight:500; box-shadow:var(--shadow); z-index:50; max-width:calc(100% - 32px);
}
.split{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px}
.filterbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.pills{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.pill{display:inline-flex; align-items:center; gap:6px; padding:3px 6px 3px 10px; border-radius:20px;
  font-size:12px; background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent-line)}
.pill button{background:none; border:0; color:inherit; cursor:pointer; font-size:14px; line-height:1; padding:0 2px}
.pill button:hover{opacity:.6}
.filterbar input[type=text]{flex:1 1 190px; max-width:340px}
.filterbar select{width:auto; min-width:120px}
.small{font-size:12px; color:var(--muted)}
.mono{font-family:var(--mono)}
.stack{display:flex; flex-direction:column; gap:12px}
.checkline{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--text)}
.checkline input{accent-color:var(--accent)}
/* coverage matrix — a cell is a count, the hue carries magnitude */
.matrix{border-collapse:separate; border-spacing:2px; width:100%; font-size:12.5px}
.matrix th{background:transparent; position:static; padding:4px 8px; white-space:nowrap}
.matrix th.rowhead{text-align:left; text-transform:none; letter-spacing:0; font-family:var(--sans);
  font-size:13px; color:var(--text); font-weight:500; max-width:260px; overflow:hidden; text-overflow:ellipsis}
.matrix td{
  text-align:center; padding:0; border:0; border-radius:4px;
  font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12.5px;
}
.matrix td>span,.matrix td>button{display:block; width:100%; padding:7px 6px; border-radius:4px}
.matrix td>button{background:none; border:0; color:inherit; font:inherit; cursor:pointer}
.matrix td>button:hover{box-shadow:inset 0 0 0 2px var(--text)}
.matrix td.z{color:var(--faint)}
.matrix td.tot{background:var(--surface-2); color:var(--text); font-weight:600}
.matrix tbody tr:hover td{outline:1px solid var(--accent-line)}

/* single-series bars: one hue, direct labels, no legend needed */
.bars{display:flex; flex-direction:column; gap:7px}
.barrow{display:grid; grid-template-columns:minmax(120px,200px) 1fr auto; gap:10px; align-items:center;
  font-size:12.5px; width:100%; text-align:left; background:none; border:0; color:inherit; font-family:inherit;
  padding:2px 4px; border-radius:5px}
button.barrow{cursor:pointer}
button.barrow:hover{background:var(--surface-3)}
button.barrow:hover .bartrack>i{filter:brightness(1.12)}
.bartrack{background:var(--surface-2); border-radius:3px; height:10px; overflow:hidden}
.bartrack>i{display:block; height:100%; background:var(--accent); border-radius:0 3px 3px 0}
.barval{font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--muted); min-width:34px; text-align:right}

.gaprow{display:flex; gap:9px; align-items:flex-start; padding:8px 10px; border-radius:6px;
  background:var(--crit-soft); font-size:13px; width:100%; text-align:left; border:0;
  color:inherit; font-family:inherit; cursor:pointer}
.gaprow:hover{box-shadow:inset 0 0 0 1px var(--crit)}
.gaprow .mono{flex:none; color:var(--crit); font-weight:600}

/* ---------- test case health ---------- */
.hchip{display:inline-flex; align-items:center; gap:6px; padding:2px 9px 2px 3px; border-radius:20px;
  font-size:11.5px; font-weight:500; border:1px solid var(--line-soft);
  background:var(--surface-2); color:var(--muted); white-space:nowrap}
.hchip .hs{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:11px; font-weight:600;
  min-width:28px; text-align:center; padding:1px 4px; border-radius:20px;
  background:var(--surface); color:var(--text)}
.hchip.good{background:var(--good-soft); color:var(--good); border-color:transparent}
.hchip.warn{background:var(--warn-soft); color:var(--warn); border-color:transparent}
.hchip.crit{background:var(--crit-soft); color:var(--crit); border-color:transparent}

.checklist{display:flex; flex-direction:column; gap:5px; margin:0; padding:0; list-style:none}
.checklist li{display:grid; grid-template-columns:15px minmax(92px,128px) 1fr; gap:9px; align-items:baseline;
  font-size:12.5px; padding:5px 9px; border-radius:6px;
  background:var(--surface-3); border:1px solid var(--line-soft)}
.checklist .mk{font-family:var(--mono); font-size:12px; text-align:center; font-weight:600}
.checklist .lb{font-weight:500}
.checklist .nt{color:var(--muted)}
.checklist li.good .mk{color:var(--good)}
.checklist li.warn .mk{color:var(--warn)}
.checklist li.crit .mk{color:var(--crit)}
.checklist li.na{opacity:.55}
button.barrow.on{background:var(--accent-soft); box-shadow:inset 0 0 0 1px var(--accent-line)}

/* ---------- traceability: requirement, criterion, case ---------- */
.tracereq{border:1px solid var(--line); border-radius:8px; background:var(--surface); overflow:hidden}
.tracereq+.tracereq{margin-top:8px}
.tracereq>summary{display:flex; flex-wrap:wrap; gap:8px 11px; align-items:center;
  padding:9px 12px; cursor:pointer; background:var(--surface-3); font-size:13px; list-style:none}
.tracereq>summary::-webkit-details-marker{display:none}
.tracereq>summary::marker{content:""}
.tracereq>summary:hover{background:var(--surface-2)}
.tracereq>summary .tw{font-family:var(--mono); font-size:10px; color:var(--faint); flex:none; width:10px}
.tracereq[open]>summary .tw::after{content:"\25be"}
.tracereq:not([open])>summary .tw::after{content:"\25b8"}
.tracereq>summary .key{font-family:var(--mono); font-size:12px; font-weight:600; color:var(--accent); flex:none}
.tracereq>summary .sum{flex:1 1 200px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tracereq>summary .techs{display:flex; flex-wrap:wrap; gap:5px}
.tracereq[open]>summary .techs{display:none}
.tracereq .acrows{display:flex; flex-direction:column; gap:7px; padding:11px 12px}
.acrow{display:grid; grid-template-columns:42px 1fr; gap:10px; align-items:start; font-size:12.5px;
  padding:8px 10px; border-radius:6px; background:var(--surface-3); border:1px solid var(--line-soft)}
.acrow.gap{background:var(--crit-soft); border-color:transparent}
.acrow .acn{font-family:var(--mono); font-size:10.5px; color:var(--faint); padding-top:3px}
.acrow.gap .acn{color:var(--crit); font-weight:600}
.acrow .acbody{display:flex; flex-direction:column; gap:7px; min-width:0}
.acrow .acacts{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.acrow .acacts .chip{max-width:100%; overflow:hidden; text-overflow:ellipsis; display:inline-block}

/* ---------- step editor ---------- */
.steps th.acts,.steps td.acts{width:108px; white-space:nowrap; text-align:right}
.stepbtn{display:inline-flex; align-items:center; justify-content:center; width:23px; height:23px;

<div class="wrap">
  <header class="masthead">
    <div class="brand">
      <span class="eyebrow">Archiv &rarr; Anforderung &rarr; qTest</span>
      <h1>Testfall-Schmiede</h1>
      <p class="sub">Import your existing test-case archive in any order, pull requirements out of Jira, and forge new qTest-ready test cases that keep your team's conventions.</p>
    </div>
    <div class="masthead-actions">
      <button class="btn sm" id="btn-undo" type="button" hidden></button>
      <button class="btn sm" id="btn-save" type="button">Save project</button>
      <button class="btn sm" id="btn-open" type="button">Open project</button>
      <input type="file" id="project-file" accept=".json" hidden>
      <button class="btn sm" id="btn-theme" type="button">Theme</button>
      <button class="btn sm" id="btn-sample" type="button">Load sample data</button>
      <button class="btn sm" id="btn-reset" type="button">Clear all</button>
    </div>
  </header>

  <div class="kpis" id="kpis"></div>

  <div class="shell" id="shell">
    <nav class="rail" id="rail" aria-label="Pipeline"></nav>
    <main id="panel" class="panel"></main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
"use strict";

/* ======================================================================
   Kronicore Testfall-Schmiede
   Everything runs in the browser. Nothing is uploaded anywhere.
   ====================================================================== */

const LS_KEY = "kronicore.forge.v2";

const S = {
  stage: "archive",
  archive: [],        // past test cases  {tcid,name,…,requirement,area,path,steps:[{action,expected}]}
  history: [],        // past requirements, linked to those test cases by issue key
  requirements: [],   // {key,summary,description,ac:[{text,kind,technique}],issuetype,epic,labels,components,fixVersion,priority,selectedTemplate}
  drafts: [],
  conventions: null,
  archiveHeaders: null,
  sampleLoaded: false,
  filters: { archive:"", archiveType:"", archiveArea:"", archiveHealth:"", drafts:"",
             draftReq:"", draftTech:"", draftModule:"", draftFlag:"" },
  importPath: "",                   // node of the module tree the next import belongs to
  migrateThreshold: 40,             // percent from which a suggestion is applied in bulk
  moduleTree: [],                   // full paths, pasted once from qTest
  gen: {
    positive:true, negative:true, boundary:true, roles:true, e2e:true,
    usePreamble:true, useEpilogue:true, namePattern:"", minScore:0.10,
    lang:"auto",                    // auto = whatever language the archive is written in
    target:"qtest"                  // qtest | tosca | both
  },
  exp: { delimiter:";", bom:true, repeatName:true, traceability:true, onlyApproved:true, headerLang:"archive", customFields:true, modulePath:true, pathSep:" > " },
  jiraAcField: "",    // e.g. customfield_10101, when Jira does not send field names
  views: [],          // named filter bundles for the knowledge base
  review: { group: "", compact: false },   // how the draft list is laid out
  railFold: false
};

/* ---------------------------------------------------------------- utils */
const $ = (sel, root) => (root||document).querySelector(sel);
const el = (tag, attrs, kids) => {
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === "class") n.className = attrs[k];
    else if (k === "html") n.innerHTML = attrs[k];
    else if (k === "text") n.textContent = attrs[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) n.setAttribute(k, attrs[k]);
  }
  if (kids) (Array.isArray(kids) ? kids : [kids]).forEach(c => c && n.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
  return n;
};
const esc = s => String(s == null ? "" : s);
const clean = s => esc(s).replace(/\s+/g, " ").trim();
// same, but line breaks survive: inside a step they carry the bullet structure
const cleanML = s => esc(s).replace(/\r\n?/g, "\n").replace(/[ \t\u00a0]+/g, " ")
  .replace(/ *\n */g, "\n").replace(/\n{3,}/g, "\n\n").trim();
const titlecase = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const uniq = a => Array.from(new Set(a.filter(x => x !== "" && x != null)));

let toastTimer = null;
function toast(msg) {
  const old = $(".toast"); if (old) old.remove();
  clearTimeout(toastTimer);
  const t = el("div", { class: "toast", text: msg, role: "status" });
  document.body.appendChild(t);
  toastTimer = setTimeout(() => t.remove(), 3200);
}

let storageWarned = false;
function save() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      archive: S.archive, history: S.history, requirements: S.requirements, drafts: S.drafts,
      conventions: S.conventions, archiveHeaders: S.archiveHeaders,
      sampleLoaded: S.sampleLoaded, gen: S.gen, exp: S.exp, jiraAcField: S.jiraAcField, importPath: S.importPath, moduleTree: S.moduleTree, migrateThreshold: S.migrateThreshold,
      views: S.views, review: S.review, railFold: S.railFold
    }));
  } catch (e) {
    if (!storageWarned) {
      storageWarned = true;
      toast("This browser will not keep your work between visits — export before you close the tab.");
    }
  }
}
function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    Object.assign(S, {
      archive: d.archive || [], history: d.history || [], requirements: d.requirements || [], drafts: d.drafts || [],
      conventions: d.conventions || null, archiveHeaders: d.archiveHeaders || null,
      sampleLoaded: !!d.sampleLoaded,
      jiraAcField: d.jiraAcField || "",
      importPath: d.importPath || d.importArea || "",
      migrateThreshold: d.migrateThreshold || 40,
      views: d.views || [],
      railFold: !!d.railFold,
      moduleTree: d.moduleTree || []
    });
    if (d.gen) Object.assign(S.gen, d.gen);
    if (d.exp) Object.assign(S.exp, d.exp);
    if (d.review) Object.assign(S.review, d.review);
    return true;
  } catch (e) { return false; }
}

/* ------------------------------------------------- the work, as one file */
/* localStorage is per browser and per machine. A project file is what lets you
   work on two releases, hand a configured knowledge base to a colleague, and
   survive a cleared browser. */
const PROJECT_KEYS = ["archive","history","requirements","drafts","conventions",
  "archiveHeaders","moduleTree","importPath","gen","exp","jiraAcField","migrateThreshold",
  "views","review"];

function projectJson() {
  const out = { app: "testfall-schmiede", version: 1, savedAt: new Date().toISOString() };
  PROJECT_KEYS.forEach(k => { out[k] = S[k]; });
  return JSON.stringify(out, null, 1);
}
function loadProject(text) {
  const d = JSON.parse(text);
  if (!d || d.app !== "testfall-schmiede") throw new Error("this is not a Testfall-Schmiede project file");
  pushUndo("opening a project");
  PROJECT_KEYS.forEach(k => { if (d[k] !== undefined) S[k] = d[k]; });
  S.sampleLoaded = false;
  buildIdf(); deriveConventions(); save(); renderAll();
  toast("Project opened — " + S.archive.length + " cases, " + S.requirements.length + " requirements, " + S.drafts.length + " drafts.");
}

/* ---- one step back, for the actions that cannot be clicked away ---------- */
const UNDOABLE = ["archive","history","requirements","drafts","moduleTree"];
let UNDO = null;
function pushUndo(label) {
  try {
    const d = {};
    UNDOABLE.forEach(k => { d[k] = S[k]; });
    UNDO = { label: label, data: JSON.stringify(d) };
  } catch (e) { UNDO = null; }
}
function undoLast() {
  if (!UNDO) return;
  let d;
  try { d = JSON.parse(UNDO.data); } catch (e) { toast("That step cannot be undone."); UNDO = null; return; }
  UNDOABLE.forEach(k => { if (d[k] !== undefined) S[k] = d[k]; });
  const label = UNDO.label;
  UNDO = null;
  buildIdf(); deriveConventions(); save(); renderAll();
  toast("Undone: " + label);
}
function renderUndo() {
  const b = $("#btn-undo");
  if (!b) return;
  b.hidden = !UNDO;
  if (UNDO) b.textContent = "Undo " + UNDO.label;
}

/* ---- re-importing a module must update it, not clone it ------------------ */
function mergeArchive(cases) {
  const index = new Map();
  S.archive.forEach((c, i) => index.set(c.tcid + "|" + c.name, i));
  let added = 0, updated = 0;
  cases.forEach(c => {
    const k = c.tcid + "|" + c.name;
    if (index.has(k)) { S.archive[index.get(k)] = c; updated++; }
    else { index.set(k, S.archive.length); S.archive.push(c); added++; }
  });
  return { added: added, updated: updated };
}

/* Carried over whole from the knowledge base, either to Tosca or onto a
   criterion — either way it is not a new case that happens to look like one. */
const fromArchive = d => d.origin === "archive" || d.origin === "linked";

/* ---- is this draft just a case we already have? -------------------------- */
function flagDuplicates() {
  if (!S.archive.length || !S.drafts.length) return;
  const arc = S.archive.map(c => ({ c: c, tok: tokenize(archiveText(c)) }));
  S.drafts.forEach(d => {
    const dTok = tokenize(d.name + " " + d.description + " " +
      d.steps.map(x => x.action + " " + x.expected).join(" "));
    let best = null, score = 0;
    arc.forEach(a => {
      if (a.c.tcid === d.templateId && fromArchive(d)) return;  // it *is* that case
      const sc = cosine(dTok, a.tok);
      if (sc > score) { score = sc; best = a.c; }
    });
    d.similar = (best && score >= 0.6)
      ? { tcid: best.tcid, name: best.name, score: Math.round(score * 100) }
      : null;
  });
}

/* ------------------------------------------------------- CSV in and out */
function detectDelimiter(text) {
  const line = text.split(/\r?\n/).find(l => l.trim().length) || "";
  let best = ",", bestN = -1;
  for (const d of [",", ";", "\t", "|"]) {
    let n = 0, q = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') q = !q; else if (c === d && !q) n++;
    }
    if (n > bestN) { bestN = n; best = d; }
  }
  return best;
}

function parseDelimited(text, delim) {
  text = String(text).replace(/^﻿/, "");
  const d = delim || detectDelimiter(text);
  const rows = []; let row = [], field = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += c;
    } else if (c === '"') q = true;
    else if (c === d) { row.push(field); field = ""; }
    else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else if (c !== "\r") field += c;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ""));
}

const isSheetFile = name => /\.(xlsx|xlsm|xls)$/i.test(name || "");

/* qTest exports one sheet per module, named "MD-42 Katalog", and the
   test cases inside carry no module column — so the sheet name is the module. */
function sheetTables(buffer) {
  if (typeof XLSX === "undefined") return null;
  const wb = XLSX.read(buffer, { type: "array", cellDates: true });
  const out = [];
  wb.SheetNames.forEach(name => {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: "", blankrows: false, raw: false })
      .map(r => r.map(c => (c === null || c === undefined) ? "" : String(c)))
      .filter(r => r.some(c => c.trim() !== ""));
    if (rows.length >= 2) out.push({ sheet: name, rows: rows });
  });
  return out;
}
/* The qTest module tree is four to six levels deep and a sheet name only ever
   carries the leaf, so an import is placed by its full path. The tree is pasted
   once: indented text as it appears in qTest, or one "A > B > C" path per line. */
function parseModuleTree(text) {
  const out = [];
  const stack = [];
  String(text || "").split(/\r?\n/).forEach(raw => {
    if (!clean(raw)) return;
    if (raw.indexOf(">") >= 0) {
      const p = raw.split(">").map(x => clean(x)).filter(Boolean).join(" > ");
      if (p) out.push(p);
      return;
    }
    const indent = (raw.match(/^[ \t]*/)[0] || "").replace(/\t/g, "    ").length;
    const name = clean(raw.replace(/^[\s|`+*▸▾►▼└├─–—]+/, ""));
    if (!name) return;
    while (stack.length && stack[stack.length - 1].indent >= indent) stack.pop();
    stack.push({ indent: indent, name: name });
    out.push(stack.map(x => x.name).join(" > "));
  });
  return uniq(out);
}
const pathLeaf = path => { const p = String(path || "").split(">"); return clean(p[p.length - 1]); };
const pathSegments = c => {
  const src = c.path || c.area || "";
  return String(src).split(">").map(x => clean(x)).filter(Boolean);
};

/* One export file is one area; the sheets inside it are its modules. */
function areaFromFile(fileName) {
  let n = String(fileName || "").replace(/\.[^.]+$/, "");
  n = n.replace(/^[0-9a-f]{6,}[-_]/i, "");                     // an upload prefix, not the area
  n = n.replace(/^(kopie[ _]von[ _]|copy[ _]of[ _])/i, "");
  n = n.replace(/[-_](test[ _]?cases?|test[ _]?runs?|testfall|testfaelle|testlauf)[-_]?\d*$/i, "");
  n = n.replace(/[-_]\d{6,}$/, "");
  return clean(n.replace(/[_]+/g, " "));
}
function moduleFromSheet(name) {
  return clean(String(name || "").replace(/^[A-Za-z]{1,3}-\d+\s*[-–:]?\s*/, ""));
}
const noReader = () => new Error("the spreadsheet reader did not load — save the file as CSV and import that");

/* The archive takes every sheet; requirements take the fullest one. */
async function readTables(file) {
  if (!isSheetFile(file.name)) return [{ sheet: "", rows: parseDelimited(await file.text()) }];
  const tables = sheetTables(await file.arrayBuffer());
  if (!tables) throw noReader();
  if (!tables.length) throw new Error("no sheet in that workbook has any rows");
  return tables;
}

/* Every shape Jira hands out, read into requirement objects. */
async function parseRequirementFile(file) {
  const table = await readTable(file);
  if (table.json) return ingestJiraJson(table.json);
  if (table.xml) return ingestJiraXml(table.xml);
  return ingestRequirementRows(table.rows);
}

/* Returns {rows} for tabular files, {json} for a pasted or uploaded Jira response. */
async function readTable(file) {
  if (isSheetFile(file.name)) {
    const tables = sheetTables(await file.arrayBuffer());
    if (!tables) throw noReader();
    let best = null;
    tables.forEach(t => { if (!best || t.rows.length > best.rows.length) best = t; });
    if (!best) throw new Error("no sheet in that workbook has any rows");
    return { rows: best.rows };
  }
  const text = await file.text();
  if (/^\s*[\[{]/.test(text)) return { json: text };
  if (/^\s*<(\?xml|rss|item)/i.test(text)) return { xml: text };
  return { rows: parseDelimited(text) };
}

function toCsv(rows, delim, bom) {
  const q = v => {
    const s = esc(v);
    return /["\n\r]|^\s|\s$/.test(s) || s.indexOf(delim) >= 0 ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return (bom ? "﻿" : "") + rows.map(r => r.map(q).join(delim)).join("\r\n");
}

/* ------------------------------------------------- header field mapping */
const norm = h => esc(h).toLowerCase().replace(/[\s_\-/\\.#()\[\]]+/g, "");

const FIELD_ALIASES = {
  tcid:        ["testcaseid","tcid","id","testid","key","nr","nummer","pid","qtestid","testcasepid","identifier"],
  name:        ["name","title","testcasename","testcasetitle","summary","bezeichnung","testfall","testfallname","testcase","titel"],
  description: ["description","beschreibung","kurzbeschreibung","objective","ziel","details","testobjective","zweck","purpose"],
  precondition:["precondition","preconditions","vorbedingung","vorbedingungen","voraussetzung","voraussetzungen","setup","initialstate","ausgangslage"],
  stepNo:      ["teststep","teststepnumber","teststep#","stepnumber","step","stepno","schritt","schrittnr","testschritt","testschrittnr","order"],
  stepAction:  ["teststepdescription","stepdescription","testschrittbeschreibung","action","aktion","stepaction","testschritte","schritte","steps","handlung","durchfuehrung","durchführung","stepdetail","teststepaction"],
  stepExpected:["teststepexpectedresult","expectedresult","expected","erwartetesergebnis","sollergebnis","erwartetesresultat","result","ergebnis","expectedoutcome","stepexpectedresult"],
  module:      ["module","modulepath","modul","folder","parentmodule","testsuite","suite","component","komponente","bereich","path","ordner"],
  type:        ["type","testtype","testcasetype","testart","kind","category","kategorie","art","testlevel","executiontype"],
  priority:    ["priority","prio","prioritaet","priorität","severity","wichtigkeit"],
  status:      ["status","state","zustand","teststatus"],
  tags:        ["tags","labels","keywords","schlagworte","stichworte"],
  // "Requirement Ids" holds the issue key that links a case to its ticket, so it
  // wins over "Requirements", which a qTest export fills with titles.
  requirement: ["requirement","requirementid","requirementids","testcasejirarequirementid","requirements","jirakey","linkedrequirement","story","anforderung","coveredrequirement","reqid"]
};

function mapHeaders(headers) {
  const norms = headers.map(norm);
  const map = {}, taken = {};
  const claim = (field, i) => { map[field] = i; taken[i] = true; };

  // Exact matches, alias by alias, so the canonical name wins a collision:
  // a project with both "Type" and "Test type" maps Type, not Test type.
  for (const field in FIELD_ALIASES) {
    const aliases = FIELD_ALIASES[field];
    for (let a = 0; a < aliases.length && map[field] === undefined; a++) {
      for (let i = 0; i < norms.length; i++) {
        if (!taken[i] && norms[i] === aliases[a]) { claim(field, i); break; }
      }
    }
  }
  // Then a looser containment pass for anything still unmapped.
  for (const field in FIELD_ALIASES) {
    if (map[field] !== undefined) continue;
    for (let i = 0; i < norms.length; i++) {
      const n = norms[i];
      if (taken[i] || n.length <= 4) continue;
      if (FIELD_ALIASES[field].some(a => a.length > 4 && (n.indexOf(a) >= 0 || a.indexOf(n) >= 0))) { claim(field, i); break; }
    }
  }
  return map;
}

/* --------------------------------------------------------- archive load */
function ingestArchiveRows(rows, sheetModule) {
  if (!rows.length) return { cases: [], headers: [] };
  const headers = rows[0].map(clean);
  const m = mapHeaders(headers);

  // qTest writes "Test Case Id" twice: the internal number and the id you see
  // in the UI. Prefer the one that reads like an id.
  if (m.tcid !== undefined) {
    const label = headers[m.tcid];
    const twins = headers.map((h, i) => i).filter(i => i !== m.tcid && headers[i] === label);
    const sample = col => {
      for (let r = 1; r < rows.length; r++) { const v = clean(rows[r][col]); if (v) return v; }
      return "";
    };
    const looksLikeId = v => /^[A-Za-z]{1,6}[-_ ]?\d+/.test(v);
    if (twins.length && !looksLikeId(sample(m.tcid))) {
      const better = twins.filter(i => looksLikeId(sample(i)))[0];
      if (better !== undefined) m.tcid = better;
    }
  }

  const get = (r, f) => m[f] === undefined ? "" : clean(r[m[f]]);
  const getML = (r, f) => m[f] === undefined ? "" : cleanML(r[m[f]]);
  const labels = {};
  Object.keys(m).forEach(f => { labels[f] = headers[m[f]]; });

  // A Test Run export carries the execution, not the design: its Id is the run,
  // its Status is the result, and there is no module or precondition.
  const runExport = headers.some(h => /^(executed (start|end)|planned (start|end) date|tester|test run)/i.test(clean(h)))
    && headers.some(h => norm(h) === "testcaseid");
  if (runExport) delete m.status;   // "Passed" is a result, not a test-case status

  const usedIdx = new Set(Object.keys(m).map(k => m[k]));
  const seenLabel = {};
  Object.keys(labels).forEach(f => { seenLabel[labels[f]] = true; });
  const extraHeaders = headers
    .map((h, i) => ({ name: h, i: i }))
    .filter(x => {
      if (!x.name || usedIdx.has(x.i) || seenLabel[x.name]) return false;
      seenLabel[x.name] = true;
      return true;
    })
    .slice(0, 30);

  const cases = [];
  let current = null, carriedKey = "";

  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const id = get(r, "tcid"), name = get(r, "name");
    const action = getML(r, "stepAction"), expected = getML(r, "stepExpected");
    const key = id || name;

    const isContinuation = current && (
      (key === "" && (action || expected)) ||
      (key !== "" && key === carriedKey)
    );

    if (!isContinuation) {
      if (!key && !action) continue;
      current = {
        tcid: id || "",
        name: name || (action ? clean(action).slice(0, 80) : "Untitled test case"),
        description: getML(r, "description"),
        precondition: getML(r, "precondition"),
        module: get(r, "module"),
        type: get(r, "type"),
        priority: get(r, "priority"),
        status: get(r, "status"),
        tags: get(r, "tags"),
        requirement: get(r, "requirement"),
        extra: {},
        steps: []
      };
      carriedKey = key;
      cases.push(current);
    } else {
      // keep the first non-empty value for header-level fields
      ["description","precondition","module","type","priority","status","tags","requirement"].forEach(f => {
        if (!current[f]) current[f] = (f === "description" || f === "precondition") ? getML(r, f) : get(r, f);
      });
    }
    extraHeaders.forEach(x => {
      const v = clean(r[x.i]);
      if (v && !current.extra[x.name]) current.extra[x.name] = v;
    });

    if (action || expected) {
      // a single-cell step list ("1. do x\n2. do y") is split into separate steps,
      // and a single overall expected result lands on the last of them
      const blob = m.stepAction === undefined ? "" : String(rows[i][m.stepAction] || "");
      // only an export without a step-number column packs several steps into one cell
      const parts = (m.stepNo === undefined && /\n|(?:^|\s)\d+[.)]\s/.test(blob)) ? splitStepBlob(blob) : null;
      if (parts && parts.length > 1) {
        if (expected) parts[parts.length - 1].expected = expected;
        parts.forEach(s => current.steps.push(s));
      } else {
        current.steps.push({ action: action, expected: expected });
      }
    }
  }

  // a run export's sheet is named after the run, so it says nothing about modules
  const fallbackModule = runExport ? "" : clean(sheetModule);
  cases.forEach((c, i) => {
    // some exports put the test-case id in the name column and have no id column
    if (!c.tcid && /^[A-Za-z]{2,6}[_-][A-Za-z0-9_-]{2,}$/.test(c.name) && c.name.indexOf(" ") < 0) c.tcid = c.name;
    if (!c.tcid) c.tcid = "ARC-" + String(i + 1).padStart(4, "0");
    if (!c.module && fallbackModule) c.module = fallbackModule;
  });
  return { cases, headers, labels: labels, runExport: runExport, extraHeaders: extraHeaders.map(x => x.name) };
}

function splitStepBlob(blob) {
  return String(blob).split(/\r?\n/).map(clean).filter(Boolean)
    .map(l => ({ action: l.replace(/^\d+[.)]\s*/, ""), expected: "" }));
}

/* ---------------------------------------------- requirements (Jira) load */
const JIRA_ALIASES = {
  key:        ["issuekey","key","issueid","ticket","schluessel","schlüssel","id"],
  summary:    ["summary","title","zusammenfassung","name"],
  description:["description","beschreibung"],
  ac:         ["acceptancecriteria","customfieldacceptancecriteria","akzeptanzkriterien","abnahmekriterien","ac","acceptance"],
  issuetype:  ["issuetype","type","vorgangstyp","typ"],
  priority:   ["priority","prioritaet","priorität"],
  epic:       ["epiclink","epic","parent","parentsummary","uebergeordnet"],
  status:     ["status"],
  fixVersion: ["fixversions","fixversion","fixversions","releaseversion","version","loesungsversion"]
};
const MULTI_ALIASES = { labels:["labels","label","stichworte"], components:["components","component","komponenten","komponente"], fixVersion:["fixversions","fixversion","fixversions","version"] };

function ingestRequirementRows(rows) {
  if (!rows.length) return [];
  const headers = rows[0].map(clean);
  const idx = {};
  headers.forEach((h, i) => {
    const n = norm(h);
    for (const f in JIRA_ALIASES) {
      if (idx[f] !== undefined) continue;
      if (JIRA_ALIASES[f].indexOf(n) >= 0) idx[f] = i;
    }
    for (const f in JIRA_ALIASES) {
      if (idx[f] !== undefined) continue;
      if (JIRA_ALIASES[f].some(a => a.length > 5 && n.indexOf(a) >= 0)) idx[f] = i;
    }
  });
  // Jira repeats Labels / Components / Fix Version columns — collect every one of them
  const multi = {};
  for (const f in MULTI_ALIASES) {
    multi[f] = headers.map((h, i) => MULTI_ALIASES[f].indexOf(norm(h)) >= 0 ? i : -1).filter(i => i >= 0);
  }

  const out = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const g = f => idx[f] === undefined ? "" : clean(r[idx[f]]);
    const gm = f => uniq((multi[f] || []).map(j => clean(r[j]))).join(", ");
    const key = g("key");
    const summary = g("summary");
    if (!key && !summary) continue;
    const descRaw = idx.description === undefined ? "" : esc(r[idx.description]);
    const acRaw = idx.ac === undefined ? "" : esc(r[idx.ac]);
    out.push(buildRequirement({
      key: key || "REQ-" + (out.length + 1),
      summary: summary || key,
      description: descRaw,
      acRaw: acRaw,
      issuetype: g("issuetype") || "Story",
      priority: g("priority"),
      epic: g("epic"),
      labels: gm("labels") || "",
      components: gm("components") || "",
      fixVersion: gm("fixVersion") || g("fixVersion")
    }));
  }
  return out;
}

/* Atlassian Document Format -> plain text */
function adfToText(node, depth) {
  depth = depth || 0;
  if (node == null) return "";
  if (typeof node === "string") return node;
  if (Array.isArray(node)) return node.map(n => adfToText(n, depth)).join("");
  let out = "";
  if (node.type === "text") out += node.text || "";
  if (node.type === "hardBreak") out += "\n";
  if (node.content) out += adfToText(node.content, depth + 1);
  if (node.type === "listItem") out = "- " + out.trim() + "\n";
  if (node.type === "paragraph" || node.type === "heading") out += "\n";
  if (node.type === "codeBlock") out += "\n";
  return out;
}

/* Jira's XML export — the one on a single issue's Export menu, and the same
   shape for a whole filter. Its <customfieldname> gives the acceptance-criteria
   field by its label, so no field id has to be looked up. */
function htmlToText(html) {
  const doc = new DOMParser().parseFromString("<body>" + String(html || "") + "</body>", "text/html");
  const walk = node => {
    if (node.nodeType === 3) return node.nodeValue.replace(/[ \t\n]+/g, " ");
    if (node.nodeType !== 1) return "";
    const tag = node.tagName.toLowerCase();
    if (tag === "br") return "\n";
    let inner = "";
    for (let i = 0; i < node.childNodes.length; i++) inner += walk(node.childNodes[i]);
    if (tag === "li") return "- " + inner.trim() + "\n";
    if (/^(p|div|h[1-6]|tr|blockquote|pre|ul|ol)$/.test(tag)) return inner.trim() + "\n";
    return inner;
  };
  return walk(doc.body).replace(/\n{3,}/g, "\n\n").trim();
}

function ingestJiraXml(text) {
  // Some exports carry named HTML entities that strict XML rejects, so fall back
  // to the lenient HTML parser — the element names are read the same way either.
  let doc = new DOMParser().parseFromString(text, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) {
    doc = new DOMParser().parseFromString(text, "text/html");
  }
  const items = doc.getElementsByTagName("item");
  if (!items.length) throw new Error("no <item> found — is this a Jira issue export?");

  const out = [];
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    const one = tag => {
      const e = it.getElementsByTagName(tag)[0];
      return e ? clean(e.textContent) : "";
    };
    const many = tag => {
      const es = it.getElementsByTagName(tag);
      const v = [];
      for (let j = 0; j < es.length; j++) if (clean(es[j].textContent)) v.push(clean(es[j].textContent));
      return uniq(v).join(", ");
    };
    const rawDesc = it.getElementsByTagName("description")[0];

    // the acceptance criteria live in a custom field, found by its own name
    let acText = "";
    const cfs = it.getElementsByTagName("customfield");
    for (let j = 0; j < cfs.length; j++) {
      const nameEl = cfs[j].getElementsByTagName("customfieldname")[0];
      const label = nameEl ? clean(nameEl.textContent) : "";
      const wanted = S.jiraAcField
        ? (label === clean(S.jiraAcField) || cfs[j].getAttribute("id") === clean(S.jiraAcField))
        : /acceptance|akzeptanz|abnahme/i.test(label);
      if (!wanted) continue;
      const vals = cfs[j].getElementsByTagName("customfieldvalue");
      const parts = [];
      for (let k = 0; k < vals.length; k++) parts.push(htmlToText(vals[k].textContent));
      acText = parts.filter(Boolean).join("\n");
      if (acText) break;
    }

    const key = one("key") || clean((one("title").match(/^\[([^\]]+)\]/) || [])[1]);
    if (!key && !one("summary")) continue;
    out.push(buildRequirement({
      key: key || "REQ-" + (out.length + 1),
      summary: one("summary") || clean(one("title").replace(/^\[[^\]]+\]\s*/, "")),
      description: rawDesc ? htmlToText(rawDesc.textContent) : "",
      acRaw: acText,
      issuetype: one("type") || "Story",
      priority: one("priority"),
      epic: one("parent"),
      labels: many("label"),
      components: many("component"),
      fixVersion: many("fixVersion")
    }));
  }
  return out;
}

function ingestJiraJson(text) {
  const data = JSON.parse(text);
  const issues = Array.isArray(data) ? data : (data.issues || (data.key ? [data] : []));
  // Jira Cloud sends opaque ids like customfield_10101; ?expand=names adds the labels
  const names = (data && data.names) || {};
  const acKeyFor = f => {
    if (S.jiraAcField && f[S.jiraAcField] !== undefined) return S.jiraAcField;
    const direct = Object.keys(f).find(k => /acceptance|akzeptanz|abnahme/i.test(k));
    if (direct) return direct;
    return Object.keys(names).find(id => /acceptance|akzeptanz|abnahme/i.test(names[id]) && f[id] != null);
  };
  return issues.map(it => {
    const f = it.fields || it;
    const acField = acKeyFor(f);
    const descText = typeof f.description === "string" ? f.description : adfToText(f.description);
    const acText = acField ? (typeof f[acField] === "string" ? f[acField] : adfToText(f[acField])) : "";
    return buildRequirement({
      key: it.key || f.key || "REQ",
      summary: clean(f.summary),
      description: descText,
      acRaw: acText,
      issuetype: (f.issuetype && f.issuetype.name) || "Story",
      priority: (f.priority && f.priority.name) || "",
      epic: (f.parent && f.parent.fields && clean(f.parent.fields.summary)) || "",
      labels: (f.labels || []).join(", "),
      components: (f.components || []).map(c => c.name || c).join(", "),
      fixVersion: (f.fixVersions || []).map(v => v.name || v).join(", ")
    });
  });
}

function buildRequirement(raw) {
  const req = Object.assign({ selectedTemplate: null, area: "" }, raw);
  req.description = clean(raw.description).length > 0 ? String(raw.description) : "";
  req.ac = extractAcceptanceCriteria(raw.acRaw, raw.description, raw.summary);
  delete req.acRaw;
  return req;
}

/* --------------------------------------------- acceptance criteria parse */
const GHERKIN_START = /^(given|angenommen|gegeben\s+sei|szenario|scenario)\b/i;
const GHERKIN_ANY   = /^(given|when|then|and|but|angenommen|gegeben\s+sei|wenn|dann|und|aber)\b[\s:]/i;
const BULLET        = /^\s*(?:[-*•‣–]|\d+[.)]|(?:AC|AK|KR)\s*\d+\s*[:.)-]?)\s+/i;
const MODAL         = /\b(must|shall|should|has to|is able to|can|will|muss|soll|sollte|kann|wird|darf)\b/i;

function extractAcceptanceCriteria(acRaw, description, summary) {
  const source = clean(acRaw).length > 3 ? acRaw : description;
  const lines = String(source || "").split(/\r?\n/).map(l => l.replace(/^\s*[>|]\s*/, "").trim()).filter(Boolean);
  const out = [];

  // A ticket often mixes both notations, so read bullets and Gherkin from the same text.
  const plain = lines.map(l => ({ raw: l, body: l.replace(BULLET, "").trim(), bulleted: BULLET.test(l) }));

  // 1. Bullet / numbered criteria that are not Gherkin lines
  plain.filter(l => l.bulleted && !GHERKIN_ANY.test(l.body))
    .forEach(l => out.push(makeAc(l.body)));

  // 2. Gherkin blocks, bulleted or not
  const gherkin = plain.filter(l => GHERKIN_ANY.test(l.body));
  if (gherkin.length >= 2) {
    let block = [];
    const flush = () => { if (block.length) { out.push(makeAc(block.join(" → "), block.slice())); block = []; } };
    plain.forEach(l => {
      if (!GHERKIN_ANY.test(l.body)) { if (/^(scenario|szenario)\b/i.test(l.body)) flush(); return; }
      if (GHERKIN_START.test(l.body) && block.length) flush();
      block.push(l.body);
    });
    flush();
  }
  if (out.length) return out;

  // 3. Sentences carrying a modal verb ("the system must ...")
  const sentences = String(source || "").replace(/\s+/g, " ")
    .split(/(?<=[.!?;])\s+(?=[A-ZÄÖÜ])/).map(s => s.trim()).filter(s => s.length > 12);
  sentences.filter(s => MODAL.test(s)).forEach(s => out.push(makeAc(s)));
  if (out.length) return out;

  // 4. Nothing structured — fall back to the summary itself
  if (clean(summary)) out.push(makeAc(clean(summary)));
  return out;
}

function makeAc(text, gherkin) {
  const t = clean(text);
  return { text: t, gherkin: gherkin || null, techniques: classifyAc(t) };
}

/* ISTQB test-design techniques — this is what decides which cases get forged.
   German inflects and compounds, so a stem is matched as a prefix:
   \bzustand\b never sees "Zustandsübergang", and \bungültig\b never sees
   "ungültiger". Only words that would be ambiguous as a prefix keep both
   boundaries — "min" would otherwise match "Minute". */
const TECH_RULES = [
  { key: "bva",
    stem: /\b(?:zwischen|mindest|höchst|hoechst|läng|laeng|length|zeichen|character|digit|grenz|größer|groesser|kleiner|greater|obergrenze|untergrenze)/,
    word: /\b(?:\d+\s*(?:-|bis|to|–|and|und)\s*\d+|between|max(?:imal|imum)?|min(?:imal|imum)?|at least|at most|up to|less than|limit|stellen)\b/ },
  { key: "epInvalid",
    stem: /\b(?:ungültig|ungueltig|unzulässig|unzulaessig|invalid|fehler|error|abgewiesen|abweis|abgelehnt|zurückgewiesen|pflichtfeld|pflichtangabe|mandatory|erforderlich|validier|validat|warnung|warning|meldung)/,
    word: /\b(?:reject|required|nicht erlaubt|not allowed|darf nicht|must not)\b/ },
  { key: "dt",
    stem: /\b(?:rolle|berechtig|permission|administrator|zugriff|gesperrt|blocked|zugelassen|befugt)/,
    word: /\b(?:role|admin|nur|only|rechte|rights|access|darf nur)\b/ },
  { key: "st",
    stem: /\b(?:status|zustand|übergang|uebergang|workflow|wechsel|transition|storniert|freigegeben|abgeschlossen)/,
    word: /\b(?:state|approved|cancelled|von .* nach|from .* to)\b/ }
];

function classifyAc(text) {
  const t = " " + text.toLowerCase() + " ";
  const tech = [];
  TECH_RULES.forEach(r => { if (r.stem.test(t) || r.word.test(t)) tech.push(r.key); });
  if (!tech.length) tech.push("ep");
  return tech;
}

/* ------------------------------------------------------ text similarity */
const STOP = new Set(("the a an and or of to in on for with as at by is are be been was were it its this that these those from into über ueber und oder der die das den dem des ein eine einen einem einer eines ist sind war waren wird werden wurde für fuer mit von zu zum zur auf bei nach aus im in am als auch nicht kann soll muss man sich dass wenn dann user benutzer system").split(/\s+/));

function tokenize(text) {
  return String(text || "").toLowerCase()
    .replace(/[^a-z0-9äöüßàâçéèêëîïôûùÿñæœ]+/g, " ")
    .split(" ")
    .map(w => w.length > 4 ? w.replace(/(en|ern|er|es|s|ung|ungen)$/, "") : w)
    .filter(w => w.length > 2 && !STOP.has(w));
}

function tf(tokens) {
  const m = new Map();
  tokens.forEach(t => m.set(t, (m.get(t) || 0) + 1));
  return m;
}

let IDF = new Map();
let MATCH_CACHE = new Map();
let TC_HISTORY = new Map();   // test case -> the past requirements it covered
let NODE_PROFILES = new Map();// tree node -> its own words plus the cases already placed there

/* Consolidating many old qTest projects into one tree means deciding, per case,
   which node it now belongs to. A node is described by its own path, and then
   increasingly by the cases placed there — so the suggestions sharpen as the
   migration proceeds. */
function buildNodeProfiles() {
  NODE_PROFILES = new Map();
  (S.moduleTree || []).forEach(path => NODE_PROFILES.set(path, [path.split(">").join(" ")]));
  S.archive.forEach(c => {
    const arr = NODE_PROFILES.get(clean(c.path));
    if (arr) arr.push(archiveText(c));
  });
}
const treeHasPath = path => !!(path && NODE_PROFILES.has(clean(path)));

function suggestNodes(tc, limit) {
  if (!NODE_PROFILES.size) return [];
  const ownTok = tokenize(archiveText(tc));                       // what the case is about
  const areaTok = tokenize(tc.path || tc.area || "");             // the old project it came from
  const tTri = trigrams(tc.name + " " + tc.module + " " + (tc.area || ""));
  const out = [];
  NODE_PROFILES.forEach((texts, path) => {
    const examples = texts.length - 1;

    // How much this case reads like the cases already placed here. A node with
    // none scores nothing on this, rather than competing on a two-word vector.
    const byExample = examples ? cosine(ownTok, tokenize(texts.slice(1).join(" "))) : 0;

    // How much of the node's own distinctive vocabulary the case uses. Words
    // every node shares — application, services, management — weigh almost
    // nothing; the word unique to one branch carries it. The old project label
    // is often the best clue — a project named after an application against that
    // application's node — but it must not outvote what the case is actually
    // about, so it is capped well below the case's own content.
    let hitOwn = 0, hitArea = 0;
    uniq(tokenize(path.split(">").join(" "))).forEach(t => {
      const w = Math.min(1.5, idf(t));
      if (ownTok.indexOf(t) >= 0) hitOwn += w;
      else if (areaTok.indexOf(t) >= 0) hitArea += w;
    });
    // Absolute evidence, not proportion: a node whose whole name is one token
    // would otherwise score full marks on a single incidental word.
    // One shared word is a hint, two or more is evidence — hence the divisor.
    const byName = 0.7 * Math.min(1, hitOwn / 4)
                 + 0.2 * Math.min(1, hitArea / 1.5)
                 + 0.1 * jaccard(tTri, trigrams(pathLeaf(path)));

    out.push({
      path: path,
      score: Math.min(1, Math.max(byExample, 0.9 * byName)),
      examples: examples,
      why: byExample >= 0.9 * byName ? "like the cases there" : "name overlap"
    });
  });
  return out.sort((a, b) => b.score - a.score).slice(0, limit || 3);
}

/* A qTest export usually already carries the issue key a case was written for,
   in "Anforderung" or "Test Case Jira Requirement ID". That is the link. */
function buildLinks() {
  TC_HISTORY = new Map();
  if (!S.history.length) return;
  const byKey = S.history.filter(h => h.key).map(h => ({ h: h, up: h.key.toUpperCase() }));
  S.archive.forEach(tc => {
    const ref = String(tc.requirement || "").toUpperCase();
    if (!ref) return;
    const hits = byKey.filter(x => ref.indexOf(x.up) >= 0).map(x => x.h);
    if (hits.length) TC_HISTORY.set(tc, hits);
  });
}
const linkedCases = h => S.archive.filter(tc => (TC_HISTORY.get(tc) || []).indexOf(h) >= 0);

function buildIdf() {
  IDF = new Map();
  MATCH_CACHE = new Map();
  buildLinks();
  buildNodeProfiles();
  const docs = S.archive.map(archiveText).concat(S.history.map(reqText)).concat(S.requirements.map(reqText));
  const n = docs.length || 1;
  docs.forEach(d => new Set(tokenize(d)).forEach(t => IDF.set(t, (IDF.get(t) || 0) + 1)));
  IDF.forEach((v, k) => IDF.set(k, Math.log(1 + n / v)));
}
const idf = t => IDF.get(t) || Math.log(1 + (S.archive.length + S.requirements.length || 1));

function cosine(aTok, bTok) {
  const A = tf(aTok), B = tf(bTok);
  let dot = 0, na = 0, nb = 0;
  A.forEach((v, k) => { const w = v * idf(k); na += w * w; if (B.has(k)) dot += w * (B.get(k) * idf(k)); });
  B.forEach((v, k) => { const w = v * idf(k); nb += w * w; });
  return (na && nb) ? dot / Math.sqrt(na * nb) : 0;
}

function trigrams(s) {
  const t = " " + String(s || "").toLowerCase().replace(/[^a-z0-9äöüß]+/g, " ").trim() + " ";
  const g = new Set();
  for (let i = 0; i < t.length - 2; i++) g.add(t.slice(i, i + 3));
  return g;
}
function jaccard(a, b) {
  if (!a.size || !b.size) return 0;
  let inter = 0; a.forEach(x => { if (b.has(x)) inter++; });
  return inter / (a.size + b.size - inter);
}

const archiveText = c => [c.name, c.description, c.module, c.tags, c.steps.map(s => s.action + " " + s.expected).join(" ")].join(" ");
const reqText = r => [r.summary, r.description, r.components, r.labels, r.ac.map(a => a.text).join(" ")].join(" ");

// a requirement held to a node stays inside that node and everything under it
const areaBlocked = (req, tc) =>
  !!(req.area && pathSegments(tc).length && pathSegments(tc).indexOf(req.area) < 0);

function scoreMatch(req, tc) {
  if (areaBlocked(req, tc)) return 0;
  const cos = cosine(tokenize(reqText(req)), tokenize(archiveText(tc)));
  const tri = jaccard(trigrams(req.summary), trigrams(tc.name));
  let score = 0.72 * cos + 0.28 * tri;
  const comps = tokenize(req.components + " " + req.labels);
  const mod = tokenize(tc.module + " " + tc.tags);
  if (comps.length && mod.length && comps.some(c => mod.indexOf(c) >= 0)) score += 0.08;
  if (tc.requirement && req.key && tc.requirement.toUpperCase().indexOf(req.key.toUpperCase()) >= 0) score += 0.25;
  if (tc.area) {
    const areaTok = tokenize(pathSegments(tc).join(" "));
    if (areaTok.length && comps.concat(tokenize(req.summary)).some(t => areaTok.indexOf(t) >= 0)) score += 0.06;
  }
  return Math.min(1, score);
}

function matchesFor(req, limit) {
  const ck = req.key + "|" + (limit || 5);
  if (MATCH_CACHE.has(ck)) return MATCH_CACHE.get(ck);

  // How close this requirement is to each past one. Requirement-to-requirement
  // is a far steadier signal than requirement-to-test-case, so wherever a link
  // exists it carries most of the weight.
  const rTok = tokenize(reqText(req));
  const histSim = new Map();
  S.history.forEach(h => histSim.set(h, cosine(rTok, tokenize(reqText(h)))));

  const res = S.archive
    .map(tc => {
      const direct = scoreMatch(req, tc);
      let via = 0, viaKey = "";
      if (!areaBlocked(req, tc)) {
        (TC_HISTORY.get(tc) || []).forEach(h => {
          const sim = histSim.get(h) || 0;
          if (sim > via) { via = sim; viaKey = h.key; }
        });
      }
      const blended = 0.55 * direct + 0.45 * via;
      const lifted = via > 0 && blended > direct;   // the link actually changed the ranking
      return {
        tc: tc,
        score: Math.min(1, lifted ? blended : direct),
        via: lifted ? via : 0,
        viaKey: lifted ? viaKey : ""
      };
    })
    .sort((a, b) => b.score - a.score)
    .slice(0, limit || 5);
  MATCH_CACHE.set(ck, res);
  return res;
}

/* ------------------------------------------- conventions from the archive */
function deriveConventions() {
  resetHealth();
  const A = S.archive;
  if (!A.length) { S.conventions = null; return; }

  const stepKey = s => clean(s.action).toLowerCase().replace(/["'„“»«]/g, "").replace(/\b\d+\b/g, "#");
  const first = new Map(), last = new Map();
  A.forEach(c => {
    if (!c.steps.length) return;
    c.steps.slice(0, 2).forEach(s => { const k = stepKey(s); if (k) first.set(k, (first.get(k) || 0) + 1); });
    const k = stepKey(c.steps[c.steps.length - 1]);
    if (k) last.set(k, (last.get(k) || 0) + 1);
  });
  const pick = (map, minShare) => Array.from(map.entries())
    .filter(([, n]) => n / A.length >= minShare && n >= 3)
    .sort((a, b) => b[1] - a[1]).slice(0, 2)
    .map(([k, n]) => {
      const src = A.find(c => c.steps.some(s => stepKey(s) === k));
      const step = src && src.steps.find(s => stepKey(s) === k);
      return { action: step ? step.action : k, expected: step ? step.expected : "", share: n / A.length, count: n };
    });

  // naming convention
  const names = A.map(c => c.name).filter(Boolean);
  const share = re => names.filter(n => re.test(n)).length / (names.length || 1);
  let pattern = "{TITLE}";
  let prefix = "";
  const segs = n => n.split("_");
  const enoughNames = names.length >= 5;   // below that any "pattern" is just one name

  // A fixed closing segment, e.g. ..._Web_Regression
  const tails = new Map();
  names.forEach(n => {
    const sg = segs(n);
    for (let k = 1; k <= 2; k++) {
      if (sg.length > k + 1) {
        const tl = sg.slice(-k).join("_");
        tails.set(tl, (tails.get(tl) || 0) + 1);
      }
    }
  });
  const tail = !enoughNames ? "" : Array.from(tails.entries())
    .filter(([, c]) => c / (names.length || 1) >= 0.35 && c >= 3)
    .sort((a, b) => (b[0].split("_").length - a[0].split("_").length) || (b[1] - a[1]))
    .map(([tl]) => tl)[0] || "";

  // The longest leading run of segments nearly every name shares: TC_, TF_, …
  let lead = "";
  for (let k = 1; enoughNames && k <= 3; k++) {
    const heads = names.filter(n => segs(n).length > k).map(n => segs(n).slice(0, k).join("_"));
    const top = topValue(heads);
    if (top && heads.filter(h => h === top).length / names.length >= 0.6) lead = top;
    else break;
  }

  const counts = names.map(n => segs(n).length).sort((a, b) => a - b);
  const medianSegs = counts[Math.floor(counts.length / 2)] || 1;
  const leadSegs = lead ? segs(lead).length : 0;
  const tailSegs = tail ? segs(tail).length : 0;
  const underscored = names.filter(n => n.indexOf("_") > 0).length / (names.length || 1);

  if (enoughNames && underscored >= 0.5) {
    prefix = lead;
    // a segment left over between the lead and the tail is the module slot
    const wantModule = medianSegs > leadSegs + tailSegs + 1;
    pattern = (lead ? lead + "_" : "") + (wantModule ? "{MODULE}_" : "") + "{TITLE}" + (tail ? "_" + tail : "");
  } else if (share(/^\[[^\]]+\]/) >= 0.35) pattern = "[{MODULE}] {TITLE}";
  else if (share(/^(verify|check|validate|prüfe|pruefe|teste|test)\b/i) >= 0.35) pattern = "Verify {TITLE}";

  // every column the tool did not recognise stays available for the export
  const extraNames = (S.archiveHeaders && S.archiveHeaders.extra) || [];
  const extra = extraNames.map(name => {
    const vals = A.map(c => (c.extra && c.extra[name]) || "").filter(Boolean);
    return { name: name, values: uniq(vals).slice(0, 25), top: topValue(vals), fill: vals.length / A.length };
  }).filter(f => f.fill > 0);

  S.conventions = {
    preamble: pick(first, 0.35),
    epilogue: pick(last, 0.35),
    namePattern: pattern,
    prefix: prefix,
    types: uniq(A.map(c => c.type)).sort(),
    priorities: uniq(A.map(c => c.priority)).sort(),
    statuses: uniq(A.map(c => c.status)).sort(),
    modules: uniq(A.map(c => c.module)).sort(),
    areas: uniq([].concat.apply([], A.map(pathSegments))).sort(),
    paths: uniq(A.map(c => c.path || c.area)).sort(),
    defaultType: topValue(A.map(c => c.type)) || "Functional",
    defaultPriority: topValue(A.map(c => c.priority)) || "Medium",
    defaultStatus: topValue(A.map(c => c.status)) || "",
    lang: detectLang(A.map(archiveText).join(" ")),
    avgSteps: Math.round(A.reduce((n, c) => n + c.steps.length, 0) / A.length * 10) / 10,
    extra: extra
  };
  if (!S.gen.namePattern) S.gen.namePattern = S.conventions.namePattern;
}

function topValue(arr) {
  const m = new Map();
  arr.filter(Boolean).forEach(v => m.set(v, (m.get(v) || 0) + 1));
  let best = "", n = 0;
  m.forEach((c, v) => { if (c > n) { n = c; best = v; } });
  return best;
}

};
function techName(key, lang) {

}

const DE_HINT = /\b(und|oder|der|die|das|den|dem|des|ein|eine|einen|einem|ist|sind|wird|werden|nicht|mit|für|fuer|auf|bei|nach|aus|im|als|auch|kann|soll|muss|darf|angemeldet|anmelden|abmelden|öffnen|oeffnen|eingeben|auswählen|prüfen|pruefen|angezeigt|erfolgreich|Fehlermeldung|Meldung|Benutzer|Artikel|Auftrag|Bestellung|Seite|Feld|Schaltfläche|Pflichtfeld|Kunde|Kunden|Menge|Preis|Betrag)\b/gi;
const EN_HINT = /\b(the|and|or|is|are|will|shall|not|with|for|on|at|after|from|as|also|can|should|must|logged|login|logout|open|enter|select|check|displayed|shown|successfully|error|message|user|article|order|page|field|button|customer|quantity|price|amount)\b/gi;

function detectLang(text) {
  const s = String(text || "");
  if (!s.trim()) return "en";
  const de = (s.match(DE_HINT) || []).length + (s.match(/[äöüßÄÖÜ]/g) || []).length * 0.5;
  const en = (s.match(EN_HINT) || []).length;
  return de > en ? "de" : "en";
}
const LANG_LABEL = { de: "Deutsch", en: "English" };

/* Which language a given requirement's cases come out in. */
function genLangFor(req) {
  if (S.gen.lang === "de" || S.gen.lang === "en") return S.gen.lang;
  if (S.conventions && S.conventions.lang) return S.conventions.lang;
  return req ? detectLang(reqText(req)) : "en";
}
